<style>
  :root{
    --font-heading: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family: var(--font-body);

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; background:none; border:none; padding:0; }

  @keyframes blink{
    0%, 100% { opacity:1; }
    50% { opacity:0; }
  }
  #cursor{ animation: blink 1s step-end infinite; }

  @media (prefers-reduced-motion: reduce){
    #cursor{ animation:none; opacity:1; }
    .hero-pills, .mobile-overlay, .hamburger-bar{ transition:none !important; }

  /* ============ background video + scrim ============ */

  .bg-scrim{

    background:linear-gradient(180deg, rgba(255,253,247,0.22) 0%, rgba(255,253,247,0.55) 100%);
  }

  /* ============ navbar ============ */
  .navbar{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px;
  }
  @media (min-width:640px){ .navbar{ padding:20px 32px; } }

  .navbar-logo{ display:flex; align-items:center; gap:12px; }
  .navbar-logo-text{
    font-family:var(--font-heading); font-size:21px; letter-spacing:-0.01em; color:#000;
  }
  @media (min-width:640px){ .navbar-logo-text{ font-size:26px; } }
  .navbar-logo-mark{
    font-size:25px; color:#000; user-select:none; letter-spacing:-0.02em; line-height:1;

  @media (min-width:640px){ .navbar-logo-mark{ font-size:30px; } }

  .navbar-links{
    display:none; align-items:center; gap:4px; font-size:23px; color:#000;
  }
  @media (min-width:768px){ .navbar-links{ display:flex; } }
  .navbar-links a{ transition:opacity .2s ease; }
  .navbar-links a:hover{ opacity:.6; }

  .navbar-cta{

  @media (min-width:768px){ .navbar-cta{ display:inline; } }

  .hamburger{

  }
  @media (min-width:768px){ .hamburger{ display:none; } }
  .hamburger-bar{ width:24px; height:2px; background:#000; transition:all .3s ease; }

  /* ============ mobile overlay ============ */
  .mobile-overlay{
    position:fixed; inset:0; z-index:9;
    background:rgba(255,255,255,0.95);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    padding:0 32px; gap:32px;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  @media (min-width:768px){ .mobile-overlay{ display:none; } }
  .mobile-overlay a{ font-size:32px; font-weight:500; color:#000; }
  .mobile-overlay a.underline-link{ text-decoration:underline; text-underline-offset:2px; }

  /* ============ hero ============ */
  .hero{
    position:relative; z-index:1; min-height:100vh;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:0 20px 48px 20px;
    overflow:hidden;
  }
  @media (min-width:640px){ .hero{ padding-left:32px; padding-right:32px; } }
  @media (min-width:768px){ .hero{ justify-content:center; padding-bottom:0; padding-left:40px; padding-right:40px; } }

  .hero-content{ max-width:36rem; position:relative; z-index:10; }
  @media (min-width:768px){ .hero-content{ max-width:44rem; } }

  .hero-intro{
    pointer-events:none; user-select:none; margin-bottom:20px;
    font-size:clamp(18px,4vw,26px); line-height:1.3; font-weight:400; color:#000;
    filter:blur(4px);
  }
  @media (min-width:640px){ .hero-intro{ margin-bottom:24px; } }

  .hero-typewriter{
    color:#000; margin-bottom:20px;
    font-size:clamp(15px,3vw,20px); line-height:1.45; font-weight:400; min-height:54px;
  }
  @media (min-width:640px){ .hero-typewriter{ margin-bottom:24px; } }

  #cursor{
    display:inline-block; width:2px; height:1.1em; background:#000;
    vertical-align:middle; margin-left:2px;
  }

  .hero-pills{
    display:flex; flex-wrap:wrap; row-gap:4px;
    opacity:0; transform:translateY(8px);
    transition:opacity .4s ease, transform .4s ease;
  }

  .copy-toast{
    display:block; margin-top:8px; font-size:12px; color:#000;
    opacity:0; transition:opacity .25s ease;
  }

  /* ============ pills ============ */
  .pill-white{
    display:inline-flex; align-items:center; justify-content:center;
    background:#fff; color:#000; border:1px solid rgba(0,0,0,0.1); border-radius:9999px;
    font-size:13px; padding:0.3em 1rem; margin:0 0.2em 0.4em; white-space:nowrap;
    transition:background-color .2s ease, color .2s ease;
    font-family:var(--font-body);
  }
  .pill-white:hover{ background:#000; color:#fff; }

  .pill-outline{
    display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;
    color:#fff; background:transparent; border:1px solid #fff; border-radius:9999px;
    font-size:13px; padding:0.3em 1rem; margin:0 0.2em 0.4em; white-space:nowrap;
    transition:background-color .2s ease, color .2s ease;
    font-family:var(--font-body);
  }
  .pill-outline:hover{ background:#fff; color:#000; }

  @media (min-width:640px){
    .pill-white{ font-size:15px; padding:0.3em 1.25rem; }
    .pill-outline{ font-size:15px; padding:0.3em 1.25rem; gap:0.75rem; }
  }
</style>

<section class="hero">
  <div class="hero-content">

    <!-- 1. Blurred intro label -->

      Hey there, this is thedayzero,<br>

    <div id="pillContainer" class="hero-pills">
      <a href="find-business.html" class="pill-white">Find What Business You Should Do</a>
      <a href="run-business-30-days.html" class="pill-white">Run Any Business In 30 Days</a>
      <a href="founder.html" class="pill-white">Meet The Founder</a>
      <a href="story.html" class="pill-white">Read Our Story</a>
      <button id="copyPill" type="button" class="pill-outline">

          <rect x="9" y="9" width="11" height="11" rx="1"></rect>
          <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
        </svg>
      </button>
    </div>
    <span id="copyToast" class="copy-toast">Copied to clipboard</span>
  </div>
</section>

<script>
(function(){

  /* ================= Mobile menu ================= */
  var hamburgerBtn = document.getElementById('hamburgerBtn');
  var mobileOverlay = document.getElementById('mobileOverlay');
  var barTop = document.getElementById('barTop');
  var barMid = document.getElementById('barMid');
  var barBot = document.getElementById('barBot');
  var menuOpen = false;

  function setMenu(open){
    menuOpen = open;
    hamburgerBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open){
      mobileOverlay.style.opacity = '1';
      mobileOverlay.style.pointerEvents = 'auto';
      barTop.style.transform = 'rotate(45deg) translateY(7px)';
      barMid.style.opacity = '0';
      barBot.style.transform = 'rotate(-45deg) translateY(-7px)';
    } else {
      mobileOverlay.style.opacity = '0';
      mobileOverlay.style.pointerEvents = 'none';
      barTop.style.transform = '';
      barMid.style.opacity = '1';
      barBot.style.transform = '';
    }
  }
  hamburgerBtn.addEventListener('click', function(){ setMenu(!menuOpen); });
  Array.prototype.forEach.call(mobileOverlay.querySelectorAll('a'), function(a){
    a.addEventListener('click', function(){ setMenu(false); });
  });

  /* ================= Typewriter ================= */
  var TYPE_TEXT = "Are you still figuring out what the purpose of your life is? Don't know what business to start, what company to build, or how to start something that actually connects to your purpose? Then you're at the right place. thedayzero helps you figure out and unlock your life's purpose for just ₹99/-, and helps you run any business in 30 days for just ₹499/-. Limited period offer only — price goes up by end of September 2026!";
  var SPEED = 16;
  var START_DELAY = 500;
  var contentEl = document.getElementById('typewriterContent');
  var cursorEl = document.getElementById('cursor');
  var i = 0;

  function typeStep(){
    if(i <= TYPE_TEXT.length){
      contentEl.textContent = TYPE_TEXT.slice(0, i);
      i++;
      if(i <= TYPE_TEXT.length){
        setTimeout(typeStep, SPEED);
      } else {
        cursorEl.style.display = 'none';
      }
    }
  }
  setTimeout(typeStep, START_DELAY);

  /* ================= Pills fade-in (independent of typewriter) ================= */
  var pillContainer = document.getElementById('pillContainer');
  setTimeout(function(){
    pillContainer.style.opacity = '1';
    pillContainer.style.transform = 'translateY(0)';
  }, 400);

  /* ================= Copy-to-clipboard pill ================= */
  var copyPill = document.getElementById('copyPill');
  var copyToast = document.getElementById('copyToast');
  var toastTimer = null;
  copyPill.addEventListener('click', function(){
    var value = '+91 96298 43122';
    function showToast(){
      copyToast.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ copyToast.style.opacity = '0'; }, 1800);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(value).then(showToast).catch(showToast);
    } else {
      showToast();
    }
  });

  /* ================= Background video: mouse-scrub control ================= */
  var video = document.getElementById('heroVideo');
  var videoReady = false;
  var prevX = null;
  var targetTime = 0;
  var isSeeking = false;
  var SENSITIVITY = 0.8;

  function markVideoReady(){
    videoReady = isFinite(video.duration) && video.duration > 0;
  }
  video.addEventListener('loadedmetadata', markVideoReady);
  // With an inline base64 (data:) source, metadata can resolve before this
  // script even runs (no network round-trip to wait on), so 'loadedmetadata'
  // may have already fired by the time we attach the listener above --
  // check readyState directly as a fallback so scrubbing still activates.
  if(video.readyState >= 1){ markVideoReady(); }

  function seekTo(time){
    if(isSeeking) return;
    isSeeking = true;
    try{ video.currentTime = time; }
    catch(e){ isSeeking = false; }
  }

  video.addEventListener('seeked', function(){
    isSeeking = false;
    if(Math.abs(video.currentTime - targetTime) > 0.03){
      seekTo(targetTime);
    }
  });

  window.addEventListener('mousemove', function(e){
    if(!videoReady){ return; }
    if(prevX === null){ prevX = e.clientX; return; }
    var delta = e.clientX - prevX;
    prevX = e.clientX;
    var offset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
    targetTime = Math.min(Math.max(targetTime + offset, 0), video.duration);
    seekTo(targetTime);
  });

})();
</script>
