<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --bg-mint:#dfe8e1;
    --bg-cream:#f4f1e7;
    --panel-mint:#e8eee6;
    --ink:#141a13;
    --ink-soft:#2b332a;
    --sage:#4f6d61;
    --sage-deep:#3a4f46;
    --sage-bright:#7fa396;
    --amber:#c97a3f;
    --line:#d7d1bd;
    --white:#fffdf7;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow-card:0 10px 34px rgba(20,26,19,0.10);
    --shadow-pop:0 20px 60px rgba(0,0,0,0.30);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg-cream);
    color:var(--ink);
    line-height:1.5;
    overflow-x:hidden;
  }
  html[lang="hi"] body, html[lang="hi"] .font-display{font-family:'Noto Sans Devanagari','Inter',sans-serif;}
  html[lang="ta"] body, html[lang="ta"] .font-display{font-family:'Noto Sans Tamil','Inter',sans-serif;}
  .label{
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
    font-size:12px;
  }
  html[lang="hi"] .label, html[lang="ta"] .label{letter-spacing:0.5px;}
  h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-0.5px;}
  html[lang="hi"] h1, html[lang="hi"] h2, html[lang="hi"] h3,
  html[lang="ta"] h1, html[lang="ta"] h2, html[lang="ta"] h3{letter-spacing:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  /* reduced motion kill-switch */
  html.reduce-motion *,
  html.reduce-motion *::before,
  html.reduce-motion *::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }

  button, .clickable{cursor:pointer;}
  button:focus-visible, a:focus-visible, input:focus-visible, .clickable:focus-visible{
    outline:3px solid var(--amber); outline-offset:2px;
  }

  /* ============ TOP CHROME: language toggle + progress dots ============ */
  .top-chrome{
    position:fixed; top:0; left:0; right:0; z-index:500;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 22px; pointer-events:none;
  }
  .top-chrome > *{pointer-events:auto;}
  .brand-mini{
    display:flex;flex-direction:column;line-height:1.15;
    background:rgba(255,253,247,0.85); backdrop-filter:blur(6px);
    padding:7px 14px;border-radius:16px;border:1.5px solid var(--line);
  }
  .brand-mini .bm-name{
    font-family:'Quicksand',sans-serif;font-weight:700;letter-spacing:1.5px;font-size:12px;color:var(--ink);
    text-transform:lowercase;
  }
  .brand-mini .bm-by{
    font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.3px;font-size:9.5px;color:var(--ink-soft);
  }
  .lang-toggle{
    display:flex;gap:2px;background:rgba(255,253,247,0.9);backdrop-filter:blur(6px);
    border:1.5px solid var(--line);border-radius:20px;padding:3px;
  }
  .lang-btn{
    border:none;background:transparent;color:var(--ink-soft);
    font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:16px;
    transition:background .2s ease, color .2s ease;
  }
  .lang-btn.active{background:var(--ink);color:var(--white);}

  .progress-dots{
    position:fixed;top:64px;left:0;right:0;z-index:490;
    display:flex;justify-content:center;gap:10px;padding:6px 0;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .progress-dots.show{opacity:1;}
  .pdot{
    display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    color:#b9b6a6;
  }
  .pdot .dotcircle{width:9px;height:9px;border-radius:50%;background:#d7d1bd;transition:background .3s ease, transform .3s ease;}
  .pdot.active{color:var(--sage-deep);}
  .pdot.active .dotcircle{background:var(--amber);transform:scale(1.3);}
  .pdot.done .dotcircle{background:var(--sage-bright);}

  /* ============ SCREENS ============ */
  #app{min-height:100vh;}
  .screen{
    display:none;
    min-height:100vh;
    padding:110px 0 60px 0;
    opacity:0;
  }
  .screen.active{display:block;}
  .screen.active.anim-in{animation:screenIn .5s ease both;}
  @keyframes screenIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  /* ============ WELCOME ============ */
  .screen-welcome{
    background:
      radial-gradient(ellipse 900px 500px at 80% -10%, rgba(127,163,150,0.35), transparent 60%),
      linear-gradient(180deg, var(--bg-mint) 0%, #b9c7bd 45%, var(--ink) 100%);
    color:var(--white);
    padding-top:130px;padding-bottom:90px;
    position:relative;overflow:hidden;
  }
  .hero-eyebrow{color:var(--ink);opacity:0.75;margin-bottom:14px;}
  .hero-title{font-size:clamp(40px,8vw,84px);line-height:0.98;color:var(--ink);}
  .hero-title .accent{display:block;color:var(--white);-webkit-text-stroke:2px var(--ink);}
  .hero-lead{margin-top:24px;max-width:560px;font-size:17px;color:var(--ink-soft);font-weight:500;}
  .hero-meta{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;}
  .pill{
    background:rgba(20,26,19,0.08);border:1.5px solid rgba(20,26,19,0.25);color:var(--ink);
    padding:8px 16px;border-radius:30px;font-size:13px;font-weight:600;
  }
  .hero-ctas{margin-top:40px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .btn{
    display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;
    padding:16px 30px;border-radius:12px;border:none;text-decoration:none;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn-primary{background:var(--ink);color:var(--white);}
  .btn-primary:hover{background:var(--sage-deep);transform:translateY(-2px);}
  .btn-ghost{background:transparent;color:var(--ink);border:2px solid rgba(20,26,19,0.3);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-icon{width:18px;height:18px;flex-shrink:0;}

  /* ============ GENERIC STEP SHELL (guide, discovery, combine, result, upsell, book) ============ */
  .step-shell{max-width:760px;margin:0 auto;padding:0 24px;}
  .step-eyebrow{color:var(--sage);text-align:center;}
  .step-title{font-size:clamp(28px,4.4vw,40px);text-align:center;margin-top:12px;color:var(--ink);}
  .step-lead{text-align:center;margin-top:14px;color:var(--ink-soft);font-size:15.5px;max-width:560px;margin-left:auto;margin-right:auto;}

  /* ============ DISCOVERY ============ */
  .discovery-progress-wrap{max-width:520px;margin:0 auto 34px auto;padding:0 24px;}
  .discovery-progress-label{text-align:center;font-size:12.5px;font-weight:700;color:var(--sage-deep);margin-bottom:8px;letter-spacing:0.5px;}
  .discovery-progress-bar{height:6px;background:var(--panel-mint);border-radius:6px;overflow:hidden;}
  .discovery-progress-fill{height:100%;background:var(--amber);border-radius:6px;transition:width .4s ease;width:25%;}

  .discovery-card{
    max-width:640px;margin:0 auto;background:var(--white);border:1.5px solid var(--line);
    border-radius:var(--radius-lg);padding:36px 34px;box-shadow:var(--shadow-card);
    display:none;
  }
  .discovery-card.active{display:block;}
  .dim-icon-row{display:flex;justify-content:center;margin-bottom:14px;}
  .dim-icon{
    width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--panel-mint);color:var(--sage-deep);
  }
  .dim-icon svg{width:26px;height:26px;}
  .dim-title{text-align:center;font-size:24px;color:var(--ink);}
  .dim-hint{text-align:center;color:var(--ink-soft);font-size:14px;margin-top:8px;margin-bottom:26px;}
  .opt-field{margin-bottom:16px;}
  .opt-field label{display:block;font-size:12px;font-weight:700;color:var(--sage-deep);margin-bottom:6px;letter-spacing:0.4px;}
  .opt-field input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;
    font-family:inherit;font-size:15px;color:var(--ink);outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;background:var(--bg-cream);
  }
  .opt-field input:focus{border-color:var(--sage-bright);box-shadow:0 0 0 3px rgba(127,163,150,0.18);background:var(--white);}
  .discovery-min-hint{text-align:center;font-size:12px;color:#8a8f7e;margin-top:6px;}
  .discovery-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;}
  .discovery-nav .btn{padding:13px 24px;font-size:14px;}
  .discovery-nav .btn[disabled]{opacity:0.35;pointer-events:none;}
  .help-fab{
    position:fixed;bottom:22px;left:22px;z-index:900;
    width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--white);
    border:none;font-weight:800;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,0.25);
  }

  /* ============ COMBINE (processing) ============ */
  .combine-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;}
  .combine-orbit{position:relative;width:180px;height:180px;margin-bottom:30px;}
  .combine-circle{
    position:absolute;width:92px;height:92px;border-radius:50%;opacity:0.55;
    animation:orbitMerge 1.8s ease-in-out infinite alternate;
  }
  .combine-circle.c1{background:var(--amber);top:0;left:0;animation-delay:0s;}
  .combine-circle.c2{background:var(--sage);top:0;right:0;animation-delay:.15s;}
  .combine-circle.c3{background:var(--sage-bright);bottom:0;left:0;animation-delay:.3s;}
  .combine-circle.c4{background:var(--ink);opacity:0.25;bottom:0;right:0;animation-delay:.45s;}
  @keyframes orbitMerge{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(var(--tx,10px), var(--ty,10px)) scale(1.12);}
  }
  .combine-circle.c1{--tx:14px;--ty:14px;}
  .combine-circle.c2{--tx:-14px;--ty:14px;}
  .combine-circle.c3{--tx:14px;--ty:-14px;}
  .combine-circle.c4{--tx:-14px;--ty:-14px;}
  .combine-title{font-size:20px;color:var(--ink);}
  .combine-sub{margin-top:8px;color:var(--ink-soft);font-size:14px;}

  /* ============ RESULT ============ */
  .result-venn-wrap{display:flex;flex-direction:column;align-items:center;margin:28px 0 10px 0;}
  .combo-card{
    max-width:640px;margin:26px auto 0 auto;background:var(--ink);color:var(--white);
    border-radius:var(--radius-lg);padding:28px 30px;text-align:center;
  }
  .combo-label{font-family:'Quicksand',sans-serif;letter-spacing:2px;text-transform:uppercase;font-size:11px;color:var(--sage-bright);font-weight:700;}
  .combo-chain{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:16px;}
  .combo-piece{
    background:rgba(255,253,247,0.08);border:1.5px solid rgba(255,253,247,0.25);
    border-radius:12px;padding:10px 14px;font-size:13.5px;max-width:180px;
  }
  .combo-piece b{display:block;font-size:10.5px;color:var(--sage-bright);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
  .combo-plus{color:var(--sage-bright);font-weight:800;font-size:18px;}
  .combo-arrow{color:var(--amber);font-weight:800;font-size:20px;}
  .combo-result-name{
    margin-top:20px;font-family:'Poppins',sans-serif;font-weight:800;font-size:24px;color:var(--amber);
  }
  .primary-lead{text-align:center;color:var(--ink-soft);font-size:14.5px;margin-top:22px;}
  .alt-label{text-align:center;margin-top:26px;}
  .alt-chips{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .alt-chip{
    background:var(--panel-mint);border:1.5px solid var(--sage-bright);color:var(--sage-deep);
    font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;
  }
  .result-actions{display:flex;justify-content:center;gap:14px;margin-top:34px;flex-wrap:wrap;}
  .snap-copied-msg{display:block;text-align:center;font-size:12px;color:var(--sage-deep);font-weight:700;margin-top:10px;opacity:0;transition:opacity .25s ease;}
  .snap-copied-msg.show{opacity:1;}
  #confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:950;}

  /* ============ UPSELL ============ */
  .upsell-card{
    max-width:680px;margin:26px auto 0 auto;background:var(--white);border:2px solid transparent;
    border-radius:var(--radius-lg);padding:38px 40px;text-align:center;box-shadow:var(--shadow-card);
  }
  .price-tag{font-family:'Poppins',sans-serif;font-weight:800;font-size:38px;color:var(--amber);margin-top:16px;}
  .price-tag span{font-size:16px;color:#9a9a8c;text-decoration:line-through;font-weight:500;margin-right:10px;}
  .plan-note{
    background:var(--panel-mint);border-left:3px solid var(--sage);border-radius:8px;
    padding:14px 18px;font-size:13.5px;color:var(--ink-soft);margin-top:22px;text-align:left;line-height:1.6;
  }
  .plan-note b{color:var(--ink);}
  .upsell-actions{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:26px;}
  .cta-secondary-link{font-size:13px;color:var(--ink-soft);text-decoration:underline;}

  /* ============ BOOK ============ */
  .book-card{
    max-width:680px;margin:26px auto 0 auto;background:var(--white);border:1.5px solid var(--line);
    border-radius:var(--radius-lg);padding:34px;box-shadow:var(--shadow-card);
  }
  .founder-row{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
  .founder-avatar{
    width:72px;height:72px;border-radius:50%;background:var(--panel-mint);color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;flex-shrink:0;
    overflow:hidden;border:2.5px solid var(--white);box-shadow:0 2px 10px rgba(20,26,19,0.15);
  }
  .founder-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .founder-name{font-weight:700;color:var(--ink);font-size:15px;}
  .founder-role{font-size:12.5px;color:var(--ink-soft);}
  .calendly-inline-widget{border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin-top:22px;}
  .book-fallback{text-align:center;margin-top:18px;}

  /* ============ FOOTER ============ */
  footer{background:var(--bg-cream);padding:40px 0;border-top:1px solid var(--line);}
  footer .fwrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;max-width:1080px;margin:0 auto;padding:0 24px;}
  footer .fname{font-family:'Quicksand',sans-serif;font-weight:700;letter-spacing:1.5px;font-size:13px;text-transform:lowercase;}
  footer .fname .fby{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.3px;text-transform:none;color:var(--ink-soft);font-size:12px;}
  footer .fcontact{font-size:13px;color:var(--ink-soft);}

  @media(max-width:600px){
    .top-chrome{padding:12px 14px;}
    .brand-mini{display:none;}
    .screen{padding-top:100px;}
    .discovery-card{padding:26px 20px;}
    .upsell-card,.book-card{padding:26px 22px;}
    .combo-piece{max-width:140px;font-size:12.5px;}
  }
  @media(max-width:375px){
    .lang-btn{padding:6px 9px;font-size:11.5px;}
  }

  /* ============ WHATSAPP STICKY ============ */
  .wa-sticky{
    position:fixed;bottom:22px;right:22px;z-index:900;
    width:58px;height:58px;border-radius:50%;background:#25D366;box-shadow:0 6px 20px rgba(0,0,0,0.25);
    display:flex;align-items:center;justify-content:center;text-decoration:none;
    transition:transform .2s ease;animation:wa-pulse 2.4s ease-in-out infinite;
  }
  .wa-sticky:hover{transform:scale(1.08);}
  .wa-sticky svg{width:30px;height:30px;}
  @keyframes wa-pulse{
    0%,100%{box-shadow:0 6px 20px rgba(0,0,0,0.25),0 0 0 0 rgba(37,211,102,0.5);}
    50%{box-shadow:0 6px 20px rgba(0,0,0,0.25),0 0 0 10px rgba(37,211,102,0);}
  }
  @media(max-width:600px){.wa-sticky{width:50px;height:50px;bottom:16px;right:16px;}.wa-sticky svg{width:25px;height:25px;}}

  /* ============ MODALS (guide + lead) ============ */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,26,19,0.55);display:none;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--white);border-radius:20px;max-width:460px;width:100%;
    padding:32px 30px 26px 30px;position:relative;box-shadow:var(--shadow-pop);
    max-height:88vh;overflow-y:auto;
    animation:modalIn .35s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .modal-close{
    position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;
    color:var(--ink-soft);width:30px;height:30px;
  }
  .modal-box .label{color:var(--sage);}
  .modal-box h3{font-size:21px;margin-top:8px;color:var(--ink);}
  .modal-box p.sub{font-size:13.5px;color:var(--ink-soft);margin-top:6px;margin-bottom:18px;}
  .guide-steps{list-style:none;display:flex;flex-direction:column;gap:14px;}
  .guide-step{display:flex;gap:12px;align-items:flex-start;}
  .guide-num{
    width:26px;height:26px;border-radius:50%;background:var(--panel-mint);color:var(--sage-deep);
    font-family:'Quicksand',sans-serif;font-weight:700;font-size:13px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .guide-step p{font-size:14px;color:var(--ink-soft);line-height:1.5;}
  .guide-cta{width:100%;margin-top:22px;}

  .lead-field{margin-bottom:14px;}
  .lead-field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .lead-field input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;
    font-family:inherit;font-size:14.5px;color:var(--ink);outline:none;transition:border-color .2s ease;
  }
  .lead-field input:focus{border-color:var(--sage-bright);}
  .lead-submit{
    width:100%;background:var(--ink);color:var(--white);border:none;padding:14px;border-radius:12px;
    font-weight:700;font-size:14.5px;margin-top:6px;font-family:inherit;
  }
  .lead-submit:hover{background:var(--sage-deep);}
  .lead-skip{
    display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--ink-soft);
    text-decoration:underline;background:none;border:none;width:100%;font-family:inherit;
  }
  .lead-thanks{display:none;text-align:center;padding:16px 0;}
  .lead-thanks.show{display:block;}
  .lead-thanks .ticon{font-size:36px;margin-bottom:10px;}
</style>
</head>
<body>

<div class="top-chrome">
  <div class="brand-mini"><span class="bm-name">thedayzero</span><span class="bm-by">by TheKahaaniya</span></div>
  <div class="lang-toggle" role="group" aria-label="Language selector">

      digital: "டிஜிட்டல் மற்றும் ஃப்ரீலான்சிங்",

</script>
<script>
(function(){
  "use strict";

  /* ================= Utilities ================= */
  function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function safeSet(key, val){ try{ localStorage.setItem(key, val); return true; }catch(e){ return false; } }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  var prefersReducedMotion = false;
  try{
    prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }catch(e){}
  if(prefersReducedMotion){ document.documentElement.classList.add('reduce-motion'); }

  /* ================= Category keyword data (matching stays English/latin-script based) ================= */
  var CATEGORY_KEYWORDS = {
    baking: ['bake','cook','cake','food','recipe','kitchen','sweet','dessert','snack','meal','catering'],
    fashion: ['fashion','cloth','style','sew','tailor','boutique','design','fabric','stitch'],
    beauty: ['makeup','beauty','skin','glam','cosmetic','hair','salon','bridal'],
    skincare: ['soap','skincare','natural','herbal','organic','oil'],
    tuition: ['teach','tutor','student','education','explain','mentor','coach','training','learn','study','exam'],
    fitness: ['fitness','yoga','gym','workout','wellness','health','nutrition','diet','meditation'],
    photo: ['photo','camera','shoot','reel','videography','film','content','edit video','video'],
    handmade: ['handmade','craft','resell','thrift','jewellery','jewelry','decor','art','painting'],
    community: ['people','connect','community','gather','network','event','group','organise','organize','plan trip','trip'],
    digital: ['write','writing','code','coding','design','online','social media','instagram','freelance','app','website'],
    localservice: ['repair','plumb','electric','clean','service','agency','delivery','errand','fix'],
    consulting: ['advice','strategy','consult','plan','solve','guide','manage','calm','pressure','organis']
  };

  function wordMatch(text, phrase){
    var esc = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
    try{ return new RegExp('\\b' + esc + '\\b', 'i').test(text); }
    catch(e){ return text.indexOf(phrase) !== -1; }
  }

  /* ================= State ================= */
  var DIMS = ['love','skill','need','paid'];
  var answers = { love:['','',''], skill:['','',''], need:['','',''], paid:['','',''] };
  var currentLang = safeGet('dz_lang') || 'en';
  var currentScreen = 'welcome';
  var currentDim = 0;
  var lastMatchResult = null;
  var guideAutoShown = safeGet('dz_guide_shown') === '1';

  var ANSWERS_KEY = 'dz_ikigai_answers_v2';
  var LANG_KEY = 'dz_lang';
  var LEAD_SHOWN_KEY = 'dz_lead_popup_shown_v2';

  function saveAnswers(){ safeSet(ANSWERS_KEY, JSON.stringify(answers)); }
  function loadAnswers(){
    var raw = safeGet(ANSWERS_KEY);
    if(!raw) return;
    try{
      var saved = JSON.parse(raw);
      DIMS.forEach(function(d){
        if(saved[d] && Array.isArray(saved[d])){
          for(var i=0;i<3;i++){ answers[d][i] = saved[d][i] || ''; }
        }
      });
    }catch(e){}
  }

  /* ================= i18n engine ================= */
  function t(key){
    var dict = window.I18N[currentLang] || window.I18N.en;
    var val = dict[key];
    if(val === undefined) val = (window.I18N.en[key] !== undefined) ? window.I18N.en[key] : key;
    return val;
  }
  function catName(catKey){
    var dict = window.I18N[currentLang] || window.I18N.en;
    return (dict.categories && dict.categories[catKey]) || (window.I18N.en.categories[catKey]) || catKey;
  }

  function applyI18n(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(!key) return;
      var suffix = el.getAttribute('data-opt-suffix');
      var text = t(key);
      if(suffix) text = text + ' ' + suffix;
      el.textContent = text;
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){
      var key = el.getAttribute('data-i18n-html');
      el.innerHTML = t(key);
    });
    document.documentElement.setAttribute('lang', currentLang);
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
    });
    // discovery placeholders
    DIMS.forEach(function(d){
      for(var i=0;i<3;i++){
        var input = document.querySelector('input[data-dim="'+d+'"][data-idx="'+i+'"]');
        if(input){ input.placeholder = t('discovery.'+d+'.ph'+(i+1)); }
      }
    });
    updateDiscoveryProgressLabel();
    if(currentScreen === 'result' && lastMatchResult){ renderResult(lastMatchResult); }
  }

  function setLang(lang){
    currentLang = lang;
    safeSet(LANG_KEY, lang);
    applyI18n();
    if(window.gtag) gtag('event','language_change',{'event_category':'engagement','event_label':lang});
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ setLang(btn.getAttribute('data-lang')); });
  });

  /* ================= Router ================= */
  var STAGE_ORDER = ['discovery','result','upsell','book'];

  function updateProgressDots(){
    var dotsWrap = document.getElementById('progressDots');
    var showDots = STAGE_ORDER.indexOf(currentScreen) !== -1;
    dotsWrap.classList.toggle('show', showDots);
    var activeIdx = STAGE_ORDER.indexOf(currentScreen);
    document.querySelectorAll('.pdot').forEach(function(dot){
      var stage = dot.getAttribute('data-stage');
      var idx = STAGE_ORDER.indexOf(stage);
      dot.classList.toggle('active', idx === activeIdx);
      dot.classList.toggle('done', idx < activeIdx);
    });
  }

  function goTo(screenName, opts){
    opts = opts || {};
    var prev = currentScreen;
    currentScreen = screenName;
    document.querySelectorAll('.screen').forEach(function(s){
      var match = s.getAttribute('data-screen') === screenName;
      s.classList.toggle('active', match);
      if(match){ s.classList.remove('anim-in'); void s.offsetWidth; s.classList.add('anim-in'); }
    });
    document.getElementById('helpFab').style.display = (screenName === 'discovery') ? 'flex' : 'none';
    updateProgressDots();
    window.scrollTo({top:0, behavior: prefersReducedMotion ? 'auto' : 'smooth'});
    try{ history.replaceState(null, '', '#/' + screenName); }catch(e){}
    if(window.gtag) gtag('event','step_view',{'event_category':'funnel','event_label':screenName});

    if(screenName === 'discovery'){
      currentDim = 0;
      renderDiscoveryDim();
      if(!guideAutoShown){ setTimeout(openGuide, 500); guideAutoShown = true; safeSet('dz_guide_shown','1'); }
    }
    if(screenName === 'combine'){
      playCombineAnimation();
    }
    if(screenName === 'result'){
      lastMatchResult = computeMatches();
      renderResult(lastMatchResult);
      maybeShowLeadPopup();
    }
    if(screenName === 'book'){
      loadCalendlyWidget();
    }
  }

  document.getElementById('startBtn').addEventListener('click', function(){ goTo('discovery'); });

  /* ================= Discovery sub-wizard ================= */
  function updateDiscoveryProgressLabel(){
    var lbl = document.getElementById('discoveryProgressLabel');
    if(lbl) lbl.textContent = t('discovery.progress_label').replace('{n}', String(currentDim+1));
    var fill = document.getElementById('discoveryProgressFill');
    if(fill) fill.style.width = (((currentDim+1)/4)*100) + '%';
  }

  function renderDiscoveryDim(){
    document.querySelectorAll('.discovery-card').forEach(function(card){
      card.classList.toggle('active', card.getAttribute('data-dim') === DIMS[currentDim]);
    });
    updateDiscoveryProgressLabel();
    var backBtn = document.getElementById('discBackBtn');
    var nextBtn = document.getElementById('discNextBtn');
    backBtn.disabled = (currentDim === 0);
    nextBtn.textContent = (currentDim === 3) ? t('discovery.finish') : t('discovery.next');
    updateVennFromAnswers();
  }

  function readCurrentDimInputs(){
    var d = DIMS[currentDim];
    for(var i=0;i<3;i++){
      var input = document.querySelector('input[data-dim="'+d+'"][data-idx="'+i+'"]');
      if(input) answers[d][i] = input.value;
    }
  }

  document.querySelectorAll('.discovery-card input').forEach(function(input){
    var timer = null;
    input.addEventListener('input', function(){
      var d = input.getAttribute('data-dim');
      var idx = parseInt(input.getAttribute('data-idx'), 10);
      answers[d][idx] = input.value;
      updateVennFromAnswers();
      clearTimeout(timer);
      timer = setTimeout(saveAnswers, 400);
    });
  });

  function restoreDiscoveryInputs(){
    DIMS.forEach(function(d){
      for(var i=0;i<3;i++){
        var input = document.querySelector('input[data-dim="'+d+'"][data-idx="'+i+'"]');
        if(input) input.value = answers[d][i] || '';
      }
    });
  }

  document.getElementById('discBackBtn').addEventListener('click', function(){
    if(currentDim === 0) return;
    readCurrentDimInputs(); saveAnswers();
    currentDim--;
    renderDiscoveryDim();
  });
  document.getElementById('discNextBtn').addEventListener('click', function(){
    readCurrentDimInputs(); saveAnswers();
    var dimFilled = answers[DIMS[currentDim]].some(function(v){ return v.trim().length > 0; });
    var card = document.querySelector('.discovery-card[data-dim="'+DIMS[currentDim]+'"]');
    if(!dimFilled){
      if(window.gsap && !prefersReducedMotion){
        gsap.fromTo(card, {x:-6}, {x:0, duration:.4, ease:'elastic.out(1,0.3)'});
      }
      var firstInput = card.querySelector('input');
      if(firstInput) firstInput.focus();
      return;
    }
    if(currentDim < 3){
      currentDim++;
      renderDiscoveryDim();
      if(window.gtag) gtag('event','discovery_dim_complete',{'event_category':'funnel','event_label':DIMS[currentDim-1]});
    } else {
      if(window.gtag) gtag('event','discovery_complete',{'event_category':'funnel','event_label':'all_dims'});
      goTo('combine');
    }
  });

  /* ================= Venn (mini, driven during discovery via progress; full reveal at result) ================= */
  function anyFilled(d){ return answers[d].some(function(v){ return v.trim().length>0; }); }

  function updateVennFromAnswers(){
    // no dedicated mini-venn on discovery screens in this build (kept for future use / result screen reads answers directly)
  }

  /* ================= Combine transition ================= */
  function playCombineAnimation(){
    var duration = prefersReducedMotion ? 50 : 1700;
    setTimeout(function(){ goTo('result'); }, duration);
  }

  /* ================= Matching engine ================= */
  function computeMatches(){
    var results = Object.keys(CATEGORY_KEYWORDS).map(function(catKey){
      var keywords = CATEGORY_KEYWORDS[catKey];
      var coverage = 0, score = 0, contributors = {};
      DIMS.forEach(function(d){
        var matched = null;
        for(var i=0;i<3;i++){
          var ans = answers[d][i];
          if(!ans || !ans.trim()) continue;
          var hitCount = keywords.reduce(function(s,k){ return s + (wordMatch(ans.toLowerCase(), k) ? 1 : 0); }, 0);
          if(hitCount > 0 && matched === null){ matched = {idx:i, text:ans.trim(), hits:hitCount}; }
        }
        if(matched){ coverage++; score += matched.hits; contributors[d] = matched; }
      });
      return {catKey:catKey, coverage:coverage, score:score, contributors:contributors};
    }).filter(function(r){ return r.coverage > 0; })
      .sort(function(a,b){ return (b.coverage - a.coverage) || (b.score - a.score); });

    return { results: results, hasMatch: results.length > 0 };
  }

  function firstNonEmpty(d){
    for(var i=0;i<3;i++){ if(answers[d][i] && answers[d][i].trim()) return {idx:i, text:answers[d][i].trim()}; }
    return {idx:0, text:''};
  }

  /* ================= Result rendering ================= */
  function renderResult(matchResult){
    var top = matchResult.hasMatch ? matchResult.results[0] : null;
    var chainWrap = document.getElementById('comboChain');
    var nameEl = document.getElementById('comboResultName');
    var leadEl = document.getElementById('primaryLeadText');
    var altBlock = document.getElementById('altBlock');
    var altChips = document.getElementById('altChips');

    chainWrap.innerHTML = '';
    var dimLabelKeys = {love:'discovery.love.title', skill:'discovery.skill.title', need:'discovery.need.title', paid:'discovery.paid.title'};
    var shortLabels = {love:'LOVE', skill:'SKILL', need:'NEED', paid:'PAID'};

    DIMS.forEach(function(d, i){
      var contributor = top && top.contributors[d] ? top.contributors[d] : firstNonEmpty(d);
      var piece = document.createElement('div');
      piece.className = 'combo-piece';
      var text = contributor.text || '—';
      piece.innerHTML = '<b>' + shortLabels[d] + '</b>' + escapeHtml(text);
      chainWrap.appendChild(piece);
      if(i < DIMS.length - 1){
        var plus = document.createElement('div');
        plus.className = 'combo-plus';
        plus.textContent = '+';
        chainWrap.appendChild(plus);
      }
    });
    var arrow = document.createElement('div');
    arrow.className = 'combo-arrow';
    arrow.textContent = '=';
    chainWrap.appendChild(arrow);

    if(top){
      nameEl.textContent = catName(top.catKey);
      leadEl.textContent = t('result.primary_lead');
    } else {
      nameEl.textContent = '';
      leadEl.textContent = t('result.no_match');
    }

    if(top && matchResult.results.length > 1){
      altBlock.style.display = '';
      altChips.innerHTML = '';
      matchResult.results.slice(1,3).forEach(function(r){
        var chip = document.createElement('div');
        chip.className = 'alt-chip';
        chip.textContent = catName(r.catKey);
        altChips.appendChild(chip);
      });
    } else {
      altBlock.style.display = 'none';
    }

    // venn circle emphasis
    DIMS.forEach(function(d){
      var el = document.getElementById('r-c-' + d);
      if(el) el.setAttribute('opacity', anyFilled(d) ? '0.42' : '0.16');
    });

    if(window.gsap && !prefersReducedMotion){
      gsap.fromTo('.combo-piece, .combo-plus, .combo-arrow', {opacity:0, y:10}, {opacity:1, y:0, duration:.4, stagger:.06, ease:'power1.out'});
      gsap.fromTo('.combo-result-name', {opacity:0, scale:.9}, {opacity:1, scale:1, duration:.5, delay:.4, ease:'back.out(1.6)'});
    }
    fireConfetti();
  }

  document.getElementById('snapCopyBtn').addEventListener('click', function(){
    var chain = Array.prototype.slice.call(document.querySelectorAll('#comboChain .combo-piece')).map(function(el){ return el.textContent; }).join(' + ');
    var name = document.getElementById('comboResultName').textContent;
    var plain = chain + (name ? (' = ' + name) : '');
    var msg = document.getElementById('snapCopiedMsg');
    function flash(){ msg.classList.add('show'); setTimeout(function(){ msg.classList.remove('show'); }, 1800); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(plain).then(flash).catch(flash);
    } else { flash(); }
  });

  document.getElementById('resultNextBtn').addEventListener('click', function(){ goTo('upsell'); });
  document.getElementById('upsellSecondaryBtn').addEventListener('click', function(){ goTo('book'); });
  document.getElementById('bookFallbackBtn').addEventListener('click', function(){
    if(window.gtag) gtag('event','calendly_click',{'event_category':'conversion','event_label':'book_free_session'});
  });
  document.getElementById('upsellPrimaryBtn').addEventListener('click', function(){
    if(window.gtag) gtag('event','upsell_click',{'event_category':'ecommerce','event_label':'day_zero_499','value':499});
  });

  /* ================= Confetti (lightweight, self-contained) ================= */
  function fireConfetti(){
    if(prefersReducedMotion) return;
    var canvas = document.getElementById('confettiCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    var colors = ['#c97a3f','#4f6d61','#7fa396','#141a13','#fffdf7'];
    var pieces = [];
    for(var i=0;i<70;i++){
      pieces.push({
        x: canvas.width/2 + (Math.random()-0.5)*120,
        y: canvas.height*0.32,
        vx: (Math.random()-0.5)*7,
        vy: -Math.random()*6 - 3,
        size: Math.random()*6+4,
        color: colors[i % colors.length],
        rot: Math.random()*360,
        vrot: (Math.random()-0.5)*10,
        life: 0
      });
    }
    var start = null;
    function frame(ts){
      if(!start) start = ts;
      var elapsed = ts - start;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(function(p){
        p.vy += 0.16;
        p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, 1 - elapsed/2200);
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
        ctx.restore();
      });
      if(elapsed < 2200){ requestAnimationFrame(frame); }
      else { ctx.clearRect(0,0,canvas.width,canvas.height); }
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function(){
    var canvas = document.getElementById('confettiCanvas');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  });

  /* ================= Calendly embed ================= */
  var calendlyLoaded = false;
  function loadCalendlyWidget(){
    if(calendlyLoaded) return;
    calendlyLoaded = true;
    var script = document.createElement('script');
    script.src = 'https://assets.calendly.com/assets/external/widget.js';
    script.async = true;
    document.body.appendChild(script);
  }

  /* ================= Guide modal ================= */
  var guideOverlay = document.getElementById('guideOverlay');
  function openGuide(){ guideOverlay.classList.add('show'); if(window.gtag) gtag('event','guide_open',{'event_category':'engagement'}); }
  function closeGuide(){ guideOverlay.classList.remove('show'); }
  document.getElementById('guideOpenBtn').addEventListener('click', openGuide);
  document.getElementById('helpFab').addEventListener('click', openGuide);
  document.getElementById('guideCloseBtn').addEventListener('click', closeGuide);
  document.getElementById('guideCtaBtn').addEventListener('click', closeGuide);
  guideOverlay.addEventListener('click', function(e){ if(e.target === guideOverlay) closeGuide(); });

  /* ================= Lead capture modal ================= */
  var GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-s9yWE6h7kufwI6VA5C43MhU9ZRfTAVgqmvRL5yYIy3uXTki8BNzOPxJ1bNdfffeH/exec";
  var leadOverlay = document.getElementById('leadOverlay');
  var leadForm = document.getElementById('leadFormEl');
  var leadFormWrap = document.getElementById('leadForm');
  var leadThanksWrap = document.getElementById('leadThanks');
  var leadSubmitBtn = document.getElementById('leadSubmitBtn');

  function maybeShowLeadPopup(){
    if(safeGet(LEAD_SHOWN_KEY)) return;
    setTimeout(function(){ leadOverlay.classList.add('show'); }, 1200);
  }
  function closeLead(){ leadOverlay.classList.remove('show'); safeSet(LEAD_SHOWN_KEY, '1'); }
  document.getElementById('leadCloseBtn').addEventListener('click', closeLead);
  document.getElementById('leadSkipBtn').addEventListener('click', closeLead);
  leadOverlay.addEventListener('click', function(e){ if(e.target === leadOverlay) closeLead(); });

  leadForm.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('leadName').value.trim();
    var phone = document.getElementById('leadPhone').value.trim();
    var email = document.getElementById('leadEmail').value.trim();
    if(!name || !phone || !email) return;
    leadSubmitBtn.disabled = true;
    var payload = { name:name, phone:phone, email:email, source:'ikigai_tool_v2', lang:currentLang, page:window.location.href, timestamp:new Date().toISOString() };
    if(GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.indexOf('PASTE_YOUR') === -1){
      fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) })
        .catch(function(){});
    }
    safeSet('dz_lead_captured', JSON.stringify(payload));
    setTimeout(function(){
      leadFormWrap.style.display = 'none';
      leadThanksWrap.classList.add('show');
      setTimeout(closeLead, 2200);
    }, 400);
  });

  /* ================= Init ================= */
  loadAnswers();
  restoreDiscoveryInputs();
  applyI18n();
  goTo('welcome');
})();
</script>
