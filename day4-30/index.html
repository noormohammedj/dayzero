<style>
  :root{
    --bg-mint:#dfe8e1; --bg-cream:#f4f1e7; --panel-mint:#e8eee6;
    --ink:#141a13; --ink-soft:#2b332a; --sage:#4f6d61; --sage-deep:#3a4f46; --sage-bright:#7fa396;
    --amber:#c97a3f; --line:#d7d1bd; --white:#fffdf7;
    --mustard-light:#f0c875; --mustard:#d9a441; --mustard-deep:#b9832a;
    --radius-lg:20px; --radius-md:14px;
    --shadow-card:0 10px 34px rgba(20,26,19,0.10); --shadow-pop:0 20px 60px rgba(0,0,0,0.30);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(160deg, var(--mustard-light) 0%, var(--mustard) 45%, var(--mustard-deep) 100%);color:var(--ink);line-height:1.5;}
  html[lang="hi"] body{font-family:'Noto Sans Devanagari','Inter',sans-serif;}
  html[lang="ta"] body{font-family:'Noto Sans Tamil','Inter',sans-serif;}
  .label{font-family:'Quicksand',sans-serif;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;font-size:12px;}
  html[lang="hi"] .label, html[lang="ta"] .label{letter-spacing:0.5px;}
  h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-0.5px;}
  html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3,html[lang="ta"] h1,html[lang="ta"] h2,html[lang="ta"] h3{letter-spacing:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after{
    animation-duration:0.01ms !important; animation-iteration-count:1 !important;
    transition-duration:0.01ms !important; scroll-behavior:auto !important;
  }
  button,.clickable{cursor:pointer;}
  button:focus-visible,a:focus-visible,input:focus-visible,.clickable:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}

  /* ============ TOP CHROME ============ */
  .top-chrome{position:sticky;top:0;z-index:500;display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;background:rgba(244,241,231,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .brand-mini{display:flex;flex-direction:column;line-height:1.15;}
  .brand-mini .bm-logo{height:32px;width:auto;display:block;}
  .brand-mini .bm-by{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.3px;font-size:10px;color:var(--ink-soft);margin-top:3px;}
  .top-chrome-right{display:flex;align-items:center;gap:10px;}
  .identity-badge{border:1.5px solid var(--line);background:var(--white);color:var(--ink-soft);font-weight:700;font-size:12px;padding:7px 13px;border-radius:20px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .identity-badge.has-name{color:var(--sage-deep);border-color:var(--sage-bright);background:var(--panel-mint);}
  .lang-toggle{display:flex;gap:2px;background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:3px;}
  .lang-btn{border:none;background:transparent;color:var(--ink-soft);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:16px;transition:background .2s ease,color .2s ease;}
  .lang-btn.active{background:var(--ink);color:var(--white);}
  @media(max-width:480px){.identity-badge{max-width:90px;font-size:10.5px;padding:7px 9px;}}

  /* ============ HERO ============ */
  .hero{padding:44px 0 30px 0;}
  .hero-eyebrow{color:rgba(20,26,19,0.62);}
  .hero h1{font-size:clamp(28px,5vw,42px);margin-top:10px;}
  .hero-lead{margin-top:12px;color:var(--ink-soft);font-size:16.5px;max-width:560px;line-height:1.55;}
  .hero-actions{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:13px 22px;border-radius:12px;border:none;text-decoration:none;transition:transform .15s ease,background .15s ease;}
  .btn-primary{background:var(--ink);color:var(--white);}
  .btn-primary:hover{background:var(--sage-deep);transform:translateY(-2px);}
  .btn-ghost{background:transparent;color:var(--ink);border:2px solid rgba(20,26,19,0.25);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-sm{padding:9px 16px;font-size:12.5px;}

  .progress-hero{display:flex;align-items:center;gap:18px;margin-top:26px;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;}
  .progress-ring{width:64px;height:64px;flex-shrink:0;}
  .progress-hero-text .ptitle{font-weight:700;font-size:15px;color:var(--ink);}
  .progress-hero-text .psub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .progress-bar-track{height:8px;background:var(--panel-mint);border-radius:8px;overflow:hidden;margin-top:8px;}
  .progress-bar-fill{height:100%;background:var(--amber);border-radius:8px;transition:width .5s ease;width:0%;}

  /* ============ REDO BANNER ============ */
  .redo-banner{display:none;background:var(--panel-mint);border:1.5px solid var(--sage-bright);border-radius:16px;padding:18px 20px;margin:18px 0;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .redo-banner.show{display:flex;}
  .redo-banner .rb-title{font-weight:700;font-size:14.5px;color:var(--ink);}
  .redo-banner .rb-body{font-size:14.5px;color:var(--ink-soft);margin-top:4px;max-width:440px;line-height:1.5;}
  .redo-banner .rb-actions{display:flex;gap:10px;flex-wrap:wrap;}

  /* ============ PHASE / DAY CARDS ============ */
  .phase-block{margin-top:36px;}
  .phase-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .phase-num{font-family:'Poppins',sans-serif;font-weight:800;font-size:12px;color:var(--sage-deep);background:var(--panel-mint);padding:4px 10px;border-radius:8px;}
  .phase-head h2{font-size:20px;}
  .phase-range{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .phase-mission{font-size:15.5px;color:var(--ink-soft);margin-bottom:16px;max-width:600px;line-height:1.55;}

  .day-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:12px;transition:opacity .3s ease,box-shadow .2s ease;}
  .day-card.locked{opacity:0.5;}
  .day-card.today{border-color:var(--sage-bright);box-shadow:0 4px 20px rgba(79,109,97,0.14);}
  .day-card.completed{border-color:var(--sage-bright);background:linear-gradient(180deg,var(--white) 0%,var(--panel-mint) 180%);}
  .day-head{display:flex;align-items:center;gap:14px;cursor:pointer;}
  .day-num{width:38px;height:38px;border-radius:50%;background:var(--panel-mint);color:var(--sage-deep);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:14px;flex-shrink:0;transition:background .2s ease,color .2s ease;}
  .day-card.completed .day-num{background:var(--sage);color:var(--white);}
  .day-card.locked .day-num{background:var(--line);color:#9a9a8c;}
  .day-titlewrap{flex:1;min-width:0;}
  .day-title{font-weight:700;font-size:16.5px;color:var(--ink);}
  .day-tag{font-size:11px;font-weight:700;letter-spacing:0.4px;color:var(--sage-bright);text-transform:uppercase;margin-top:2px;}
  .day-card.locked .day-tag{color:#9a9a8c;}
  .day-chevron{width:18px;height:18px;color:var(--ink-soft);transition:transform .25s ease;flex-shrink:0;}
  .day-card.expanded .day-chevron{transform:rotate(180deg);}
  .day-body{display:none;padding-top:16px;margin-top:14px;border-top:1px solid var(--line);}
  .day-card.expanded .day-body{display:block;}
  .day-task{font-size:16px;color:var(--ink-soft);line-height:1.6;}
  .day-note{margin-top:14px;}
  .day-note label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .day-note textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:16px;color:var(--ink);outline:none;resize:vertical;min-height:56px;background:var(--bg-cream);}
  .day-note textarea:focus{border-color:var(--sage-bright);background:var(--white);}
  .day-proof{margin-top:14px;background:var(--panel-mint);border-radius:10px;padding:12px 13px;}
  .day-proof label{display:block;font-size:13.5px;font-weight:700;color:var(--sage-deep);margin-bottom:6px;}
  .day-proof input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--ink);outline:none;background:var(--white);}
  .day-proof input:focus{border-color:var(--sage-bright);}
  .proof-hint{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.45;}
  .proof-sent-indicator{font-size:12px;font-weight:700;color:var(--sage-deep);}
  .day-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:10px;}
  .day-complete-check{display:flex;align-items:center;gap:10px;}
  .day-checkbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--sage);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .2s ease;}
  .day-checkbox.checked{background:var(--sage);}
  .day-checkbox svg{width:13px;height:13px;opacity:0;transition:opacity .15s ease;}
  .day-checkbox.checked svg{opacity:1;}
  .day-complete-label{font-size:15px;font-weight:600;color:var(--ink);}

  /* Day 3 decision widget */
  .decision-box{background:var(--panel-mint);border-radius:14px;padding:18px 20px;margin-top:16px;}
  .decision-q{font-weight:700;font-size:16px;color:var(--ink);margin-bottom:12px;}
  .decision-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .decision-no-note{font-size:13.5px;color:var(--ink-soft);margin-top:12px;display:none;line-height:1.5;}
  .decision-no-note.show{display:block;}

  /* ============ SURVEY / SOCIAL HOWTO ============ */
  .howto-card{background:var(--panel-mint);border-radius:16px;padding:20px 22px;margin-bottom:16px;}
  .howto-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .howto-toggle .label{color:var(--sage-deep);}
  .howto-body{display:none;margin-top:14px;}
  .howto-card.open .howto-body{display:block;}
  .howto-sub{font-weight:700;font-size:13.5px;color:var(--ink);margin:14px 0 8px 0;}
  .howto-sub:first-child{margin-top:0;}
  .howto-steps{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .howto-steps li{font-size:14.5px;color:var(--ink-soft);display:flex;gap:8px;line-height:1.5;}
  .howto-steps li b{color:var(--sage-deep);flex-shrink:0;}

  /* ============ SOCIAL TRACK ============ */
  .social-block{margin-top:36px;background:linear-gradient(160deg,var(--ink) 0%,#202a1f 100%);color:var(--white);border-radius:var(--radius-lg);padding:28px 26px;}
  .social-block .label{color:var(--sage-bright);}
  .social-block h2{font-size:22px;margin-top:8px;color:var(--white);}
  .social-block .subtitle{font-size:15px;color:#b7c2b8;margin-top:8px;max-width:520px;line-height:1.5;}
  .social-platforms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px;}
  .social-card{background:rgba(255,253,247,0.06);border:1.5px solid rgba(255,253,247,0.16);border-radius:14px;padding:16px 18px;}
  .social-card h3{font-size:15px;color:var(--white);margin-bottom:10px;}
  .social-step{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:14px;color:#d7ddd3;line-height:1.4;}
  .social-step .sc{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--sage-bright);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s ease;}
  .social-step .sc.checked{background:var(--sage-bright);}
  .social-step .sc svg{width:10px;height:10px;opacity:0;}
  .social-step .sc.checked svg{opacity:1;}
  .social-step span.txt{cursor:pointer;}
  .social-step span.txt.done{color:#8b9488;text-decoration:line-through;}
  .social-handle{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,253,247,0.14);}
  .social-handle label{display:block;font-size:13px;font-weight:700;color:var(--sage-bright);margin-bottom:6px;}
  .social-handle-row{display:flex;gap:8px;}
  .social-handle-row input{flex:1;min-width:0;border:1.5px solid rgba(255,253,247,0.2);background:rgba(255,253,247,0.08);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:16px;color:var(--white);outline:none;}
  .social-handle-row input::placeholder{color:#8b9488;}
  .social-handle-row input:focus{border-color:var(--sage-bright);}
  .social-handle .proof-sent-indicator{color:var(--sage-bright);display:block;margin-top:7px;}

  /* ============ MILESTONE ============ */
  .milestone-card{margin-top:20px;background:var(--ink);color:var(--white);border-radius:var(--radius-lg);padding:28px 26px;text-align:center;display:none;}
  .milestone-card.show{display:block;}
  .milestone-card h3{font-size:22px;margin-top:6px;}
  .milestone-card p{font-size:15.5px;color:#c8d1c6;margin-top:12px;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.55;}
  .milestone-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

  /* ============ FINAL / BOOK ============ */
  .final-block{display:none;margin-top:40px;background:var(--white);border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:36px 32px;text-align:center;}
  .final-block.show{display:block;}
  .final-block .label{color:var(--amber);}
  .final-block h2{font-size:clamp(24px,4vw,32px);margin-top:10px;}
  .final-block p{color:var(--ink-soft);font-size:16px;margin-top:14px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.55;}
  .founder-row-final{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:24px;}
  .founder-avatar-final{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2.5px solid var(--panel-mint);box-shadow:0 2px 10px rgba(20,26,19,0.15);}
  .founder-avatar-final img{width:100%;height:100%;object-fit:cover;display:block;}
  .founder-final-text{text-align:left;}
  .founder-final-name{font-weight:700;color:var(--ink);font-size:14.5px;}
  .founder-final-role{font-size:12px;color:var(--ink-soft);}
  .calendly-inline-widget{border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin-top:22px;text-align:left;}
  .final-cta-fallback{margin-top:18px;}

  #confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:950;}

  footer{background:var(--mustard-deep);padding:40px 0 90px 0;border-top:1px solid rgba(20,26,19,0.14);margin-top:40px;}
  footer .fwrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;max-width:820px;margin:0 auto;padding:0 24px;}
  footer .fname{display:flex;align-items:center;gap:9px;}
  footer .fname .footer-logo{height:26px;width:auto;display:block;}
  footer .fname .fby{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.3px;text-transform:none;color:var(--ink-soft);font-size:12px;}
  footer .flinks{font-size:12.5px;color:var(--ink-soft);text-decoration:underline;}

  .wa-sticky{position:fixed;bottom:22px;right:22px;z-index:900;width:58px;height:58px;border-radius:50%;background:#25D366;box-shadow:0 6px 20px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .2s ease;animation:wa-pulse 2.4s ease-in-out infinite;}
  .wa-sticky:hover{transform:scale(1.08);}
  .wa-sticky svg{width:30px;height:30px;}
  @keyframes wa-pulse{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,0.25),0 0 0 0 rgba(37,211,102,0.5);}50%{box-shadow:0 6px 20px rgba(0,0,0,0.25),0 0 0 10px rgba(37,211,102,0);}}
  @media(max-width:600px){.wa-sticky{width:50px;height:50px;bottom:16px;right:16px;}.wa-sticky svg{width:25px;height:25px;}}

  .help-sticky{position:fixed;bottom:22px;left:22px;z-index:900;display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--white);text-decoration:none;border:none;font-family:inherit;cursor:pointer;padding:12px 18px 12px 14px;border-radius:24px;box-shadow:0 6px 20px rgba(20,26,19,0.28);transition:transform .2s ease,background .2s ease;max-width:min(72vw,260px);text-align:left;}
  .help-sticky:hover{transform:translateY(-2px);background:var(--sage-deep);}
  .help-sticky-icon{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .help-sticky-icon svg{width:20px;height:20px;}
  .help-sticky-text{font-size:13px;font-weight:700;white-space:normal;line-height:1.25;}
  @media(max-width:600px){
    .help-sticky{left:14px;bottom:16px;padding:11px 14px 11px 11px;max-width:min(66vw,220px);}
    .help-sticky-text{font-size:12px;}
  }
  @media(max-width:380px){
    .help-sticky-text{display:none;}
    .help-sticky{padding:12px;border-radius:50%;max-width:none;}
  }

  .modal-overlay{position:fixed;inset:0;background:rgba(20,26,19,0.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--white);border-radius:20px;max-width:460px;width:100%;padding:32px 30px 26px 30px;position:relative;box-shadow:var(--shadow-pop);max-height:88vh;overflow-y:auto;animation:modalIn .35s ease;}
  .calendly-modal-box{max-width:640px;}
  .calendly-modal-box .calendly-inline-widget{border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin-top:18px;}
  @media(max-width:600px){.calendly-modal-box .calendly-inline-widget{height:520px !important;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);width:30px;height:30px;}
  .modal-box .label{color:var(--sage);}
  .modal-box h3{font-size:21px;margin-top:8px;color:var(--ink);}
  .modal-box p.sub{font-size:15px;color:var(--ink-soft);margin-top:6px;margin-bottom:18px;line-height:1.5;}
  .guide-steps{list-style:none;display:flex;flex-direction:column;gap:14px;}
  .guide-step{display:flex;gap:12px;align-items:flex-start;}
  .guide-num{width:26px;height:26px;border-radius:50%;background:var(--panel-mint);color:var(--sage-deep);font-family:'Quicksand',sans-serif;font-weight:700;font-size:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .guide-step p{font-size:15.5px;color:var(--ink-soft);line-height:1.55;}
  .guide-cta{width:100%;margin-top:22px;}
  .identity-field{margin-bottom:14px;}
  .identity-field label{display:block;font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .identity-field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;font-family:inherit;font-size:16px;color:var(--ink);outline:none;background:var(--bg-cream);}
  .identity-field input:focus{border-color:var(--sage-bright);background:var(--white);}
  .identity-submit{width:100%;margin-top:6px;}
  .identity-skip{display:block;width:100%;text-align:center;background:none;border:none;color:var(--ink-soft);font-size:12.5px;font-weight:600;text-decoration:underline;margin-top:14px;padding:4px;}

  @media(max-width:600px){
    .day-card{padding:16px 16px;}
    .final-block{padding:26px 20px;}
    .founder-row-final{flex-direction:column;text-align:center;}
    .founder-final-text{text-align:center;}
  }
</style>

  "day.8.task": "अपने सर्वे में लोगों ने जो बताया उसके आधार पर कीमत तय करें — अंदाज़ा नहीं, बल्कि कॉम्पिटिटिव कीमत।",
  "day.9.title": "कम से कम 3 लोगों को दें",
  "day.9.task": "अपना टेस्ट वर्ज़न सच में 3 असली लोगों को दें — बेचें, गिफ़्ट करें, या मुफ़्त में करें।",

  "phase.feedback1.name": "फ़ीडबैक इकट्ठा करें",
  "phase.feedback1.range": "डे 10–12",
  "phase.feedback1.mission": "अब उन लोगों के पास वापस जाएं जिन्होंने इसे अनुभव किया और पूछें कि वे सच में क्या सोचते हैं — न कि जो वे सोचते हैं आप सुनना चाहते हैं।",
  "day.10.title": "अपने पहले ग्राहकों से पूछें",
  "day.10.task": "हर उस व्यक्ति से पूछें जिसने आपका टेस्ट वर्ज़न अनुभव किया: उन्हें क्या पसंद आया, वे क्या बदलेंगे, क्या वे फिर से पैसे देंगे?",
  "day.11.title": "कुछ और लोगों से पूछें",
  "day.11.task": "उसी तरह 3 और लोगों तक पहुंचें — अपना फ़ीडबैक पूल कम से कम 6 लोगों तक बढ़ाएं।",
  "day.12.title": "पैटर्न लिखें",
  "day.12.task": "बार-बार आने वाले फ़ीडबैक को देखें — 2 या ज़्यादा लोगों की एक जैसी बात एक असली संकेत है, राय नहीं।",

  "phase.adjust1.name": "फ़िट के लिए एडजस्ट करें",
  "phase.adjust1.range": "डे 13–15",
  "phase.adjust1.mission": "यहीं ज़्यादातर लोग छोड़ देते हैं। आप मत छोड़ना। इसके बजाय एडजस्ट करें — जल्दी टेस्ट करने का यही पूरा मतलब है।",
  "day.13.title": "बदलने के लिए एक चीज़ चुनें",
  "day.13.task": "अपने फ़ीडबैक पैटर्न के आधार पर, सबसे बड़ा बदलाव चुनें — कीमत, फ़ॉर्मेट, ऑफ़र, या ऑडियंस।",
  "day.14.title": "बदलाव करें",
  "day.14.task": "कल जो तय किया था उसके आधार पर अपना ऑफ़र, कीमत, या डिलीवरी सच में अपडेट करें।",
  "day.15.title": "माइलस्टोन: राउंड 1 पूरा",
  "day.15.task": "डे 1 पर वापस देखें। एक वाक्य लिखें कि अब आप क्या जानते हैं जो 15 दिन पहले नहीं जानते थे।",
  "milestone.day15.title": "आपने अभी राउंड 1 पूरा किया।",
  "milestone.day15.body": "पंद्रह दिन पहले आपके पास एक आइडिया था। अब आपके पास असली फ़ीडबैक और एक बेहतर ऑफ़र है — यह ज़्यादातर लोगों से आगे है। राउंड 2 से पहले इस पर एक और नज़र चाहिए?",
  "milestone.cta": "नूर के साथ मुफ़्त 15-मिनट सेशन बुक करें",
  "milestone.dismiss": "राउंड 2 पर जारी रखें",

  "phase.test2.name": "फिर से टेस्ट करें, राउंड 2",
  "phase.test2.range": "डे 16–18",
  "phase.test2.mission": "वही टेस्ट, बेहतर ऑफ़र। इस बार आप पहले से जानते हैं लोगों को क्या चाहिए — डे 16 से, नीचे आपकी सोशल मीडिया चेकलिस्ट भी अनलॉक होती है। इसे अपने डेली टास्क के साथ, अपनी रफ़्तार से करें।",
  "day.16.title": "अपना सर्वे फिर से चलाएं (छोटा वर्ज़न)",
  "day.16.task": "अपने नए ऑफ़र के बारे में 10 लोगों को एक क्विक 2-सवाल वाला चेक भेजें: क्या यह आपके लिए बेहतर काम करेगा?",
  "day.17.title": "अपनी कीमत और ऑफ़र कन्फ़र्म करें",
  "day.17.task": "क्विक चेक के आधार पर अपनी एडजस्ट की गई कीमत और ऑफ़र लॉक करें।",
  "day.18.title": "अपनी अगली डिलीवरी तैयार करें",
  "day.18.task": "इस हफ़्ते अपना बेहतर वर्ज़न देने के लिए सब कुछ तैयार करें।",

  "phase.build2.name": "फिर से बनाएं, राउंड 2",
  "phase.build2.range": "डे 19–21",
  "phase.build2.mission": "बेहतर वर्ज़न दें और ध्यान से देखें कि इस बार क्या अलग है।",
  "day.19.title": "बेहतर वर्ज़न दें",
  "day.19.task": "अपना एडजस्ट किया हुआ ऑफ़र कम से कम 3 नए लोगों को दें।",
  "day.20.title": "3 और लोगों को दें",
  "day.20.task": "उसी बेहतर ऑफ़र के साथ 3 और लोगों तक पहुंचें — इस राउंड में कुल 6 या ज़्यादा।",
  "day.21.title": "देखें क्या अलग है",
  "day.21.task": "इस राउंड की प्रतिक्रियाओं की राउंड 1 से तुलना करें — क्या बेहतर है, अभी भी क्या काम चाहिए?",

  "phase.feedback2.name": "फ़ीडबैक + एडजस्ट, राउंड 2",
  "phase.feedback2.range": "डे 22–24",
  "phase.feedback2.mission": "आप सच में क्या बेच रहे हैं इसे लॉक करने से पहले एक और ईमानदार नज़र।",
  "day.22.title": "राउंड 2 का फ़ीडबैक इकट्ठा करें",
  "day.22.task": "अपने राउंड 2 ग्राहकों से पहले जैसे ही सवाल पूछें।",
  "day.23.title": "नए पैटर्न ढूंढें",
  "day.23.task": "राउंड 1 और राउंड 2 के फ़ीडबैक की साथ-साथ तुलना करें — क्या बदला?",
  "day.24.title": "माइलस्टोन: अपना ऑफ़र लॉक करें",
  "day.24.task": "तय करें: यही अब आपका असली ऑफ़र, कीमत, और ऑडियंस है। इसे एक लाइन में लिखें।",
  "milestone.day24.title": "आपका ऑफ़र लॉक हो गया है।",
  "milestone.day24.body": "दो राउंड असली टेस्टिंग के बाद, अब आप अंदाज़ा नहीं लगा रहे — आप जानते हैं क्या बेच रहे हैं, किसे, और कितने में। अब समय है उन्हें ढूंढने का। आउटरीच प्लान करने में मदद चाहिए?",

  "social.title_label": "पैरेलल ट्रैक — अनलॉक्ड",
  "social.title": "अपनी सोशल मौजूदगी बनाएं",
  "social.subtitle": "यह डे 16–24 के साथ-साथ चलता है। इसे अपनी रफ़्तार से करें — यह आपके डेली टास्क को नहीं रोकता।",
  "social.instagram.title": "इंस्टाग्राम",
  "social.instagram.step1": "एक मुफ़्त बिज़नेस अकाउंट बनाएं (Settings → Switch to Professional Account)।",
  "social.instagram.step2": "अपनी बायो एक लाइन में लिखें: आप किसकी मदद करते हैं + आप क्या ऑफ़र करते हैं।",
  "social.instagram.step3": "अपने ऑफ़र और उसके पीछे की कहानी बताते हुए अपनी पहली 3 पोस्ट डालें।",
  "social.instagram.step4": "अपनी निच में 20 लोगों या पेजेस को फ़ॉलो करें और सच में एंगेज करें।",
  "social.facebook.title": "फ़ेसबुक",
  "social.facebook.step1": "अपने बिज़नेस के लिए एक फ़ेसबुक पेज बनाएं (पर्सनल प्रोफ़ाइल नहीं) — Pages → Create New Page।",
  "social.facebook.step2": "अपना ऑफ़र, लोकेशन, और संपर्क करने का तरीका जोड़ें।",
  "social.facebook.step3": "अपना पेज 2 लोकल या कम्युनिटी ग्रुप्स में शेयर करें जहां आपके ग्राहक होते हैं।",
  "social.youtube.title": "यूट्यूब",
  "social.youtube.step1": "अपने बिज़नेस के नाम से एक चैनल बनाएं।",
  "social.youtube.step2": "एक छोटा वीडियो पोस्ट करें (फ़ोन से भी) जिसमें बताएं आप क्या करते हैं और यह किसके लिए है।",
  "social.youtube.step3": "वीडियो डिस्क्रिप्शन में अपना इंस्टाग्राम या व्हाट्सएप लिंक जोड़ें।",

  "phase.outreach.name": "टारगेटेड क्लाइंट्स को आउटरीच करें",
  "phase.outreach.range": "डे 25–30",
  "phase.outreach.mission": "लोगों के आपको ढूंढने का इंतज़ार करना बंद करें। उन्हें ढूंढें — हर असली बिज़नेस को उसके पहले पेइंग कस्टमर ऐसे ही मिलते हैं।",
  "day.25.title": "20 आदर्श क्लाइंट्स की लिस्ट बनाएं",
  "day.25.task": "20 असली लोगों या बिज़नेस को लिखें जो बिल्कुल वैसे हैं जिन्हें आप बेचना चाहते हैं।",
  "day.26.title": "अपना आउटरीच मैसेज लिखें",
  "day.26.task": "एक छोटा, ईमानदार मैसेज लिखें जो आप उनमें से किसी को भी भेज सकें — कोई हार्ड सेल नहीं, बस एक असली ऑफ़र।",
  "day.27.title": "अपने पहले 5 को भेजें",
  "day.27.task": "आज अपनी लिस्ट के पहले 5 लोगों को मैसेज करें।",
  "day.28.title": "फ़ॉलो अप करें और सुधारें",
  "day.28.task": "जिन्होंने जवाब नहीं दिया उनसे फ़ॉलो अप करें, और अगर मैसेज असर नहीं कर रहा तो उसे बदलें।",
  "day.29.title": "अगले 10 को भेजें",
  "day.29.task": "अपनी लिस्ट के बाकी लोगों को मैसेज करें।",
  "day.30.title": "अपने 30 दिन देखें",
  "day.30.task": "इस महीने की अपनी 3 सबसे बड़ी जीत लिखें — आपने कुछ असली बनाया है।",

  "final.eyebrow": "30 दिन पूरे",
  "final.title": "आपने सिर्फ़ एक कोर्स पूरा नहीं किया। आपने एक बिज़नेस बनाया।",
  "final.body": "तीस दिन पहले यह सिर्फ़ एक आइडिया था। अब यह एक टेस्ट किया हुआ ऑफ़र है, असली ग्राहक हैं, असली फ़ीडबैक है, और एक सोशल मौजूदगी है जो आपने खुद बनाई। अगला चरण — सही कीमत तय करना, इसे बड़ा करना, और इसे लगातार आमदनी में बदलना — यही तो नूर के साथ 1:1 कोचिंग के लिए है।",
  "final.founder_role": "फ़ाउंडर, thedayzero by TheKahaaniya",
  "final.cta": "मेरा मुफ़्त 15-मिनट सेशन बुक करें",
  "final.note": "बुक करने में एक मिनट से भी कम समय लगता है। जो भी स्लॉट आपको सही लगे, चुन लें।",

  "footer.contact": "व्हाट्सएप +91 96298 43122 · @the.kahaaniya",
  "footer.quickstart_link": "इकिगाई क्विक स्टार्ट टूल फिर से करें"
},
  ta: {
  "meta.title": "டே ஜீரோ — உங்கள் 30-நாள் பிசினஸ் பில்டர்",
  "nav.brand_name": "thedayzero",
  "nav.brand_by": "by TheKahaaniya",

  "hero.eyebrow": "நீங்கள் திட்டத்தை வாங்கிவிட்டீர்கள். இப்போது கட்டமைப்போம்.",
  "hero.title": "உங்கள் 30-நாள் பிசினஸ் பில்டர்",
  "hero.lead": "ஒரு நேரத்தில் ஒரு நாள். ஒவ்வொரு நாளையும் முடித்ததும் அடுத்த நாள் திறக்கும் — முன்னேறிக் குதிக்க முடியாது, அதிக சுமையும் இல்லை. இன்றைய பணி மட்டும்.",
  "hero.progress_label": "முடிந்த நாட்கள்",
  "hero.cta_guide": "இது எப்படி வேலை செய்கிறது?",
  "hero.resume": "நாள் {n} தொடரவும்",

  "guide.title_label": "வழிகாட்டி",
  "guide.title": "இந்த 30-நாள் திட்டம் எப்படி வேலை செய்கிறது",
  "guide.subtitle": "இதை ஒருமுறை படியுங்கள் — பிறகு தினமும் வாருங்கள்.",
  "guide.step1": "இந்த திட்டம் 9 சிறிய கட்டங்களாக பிரிக்கப்பட்டுள்ளது, ஒவ்வொன்றும் 3-6 நாட்கள். உங்களுக்கு எப்போதும் இன்றைய பணி மட்டுமே தெரியும்.",
  "guide.step2": "ஒரு நாளின் பணியை முடித்து, அடுத்த நாளைத் திறக்க அதைச் சரிபார்க்கவும். நீங்கள் முன்னேறிக் குதிக்க முடியாது — இது வேண்டுமென்றே செய்யப்பட்டது.",
  "guide.step3": "நாள் 3 அன்று, நீங்கள் பயிற்சி செய்யும் திறமை உண்மையில் நீங்கள்தானா என்பதை நேர்மையாக முடிவு செய்வீர்கள். இல்லையென்றால், குயிக் ஸ்டார்ட் டூலுக்குச் சென்று அதை மீண்டும் வரையறுத்து திரும்பி வரலாம்.",
  "guide.step4": "நாள் 16 முதல், கீழே ஒரு இணையான சோஷியல் மீடியா செக்லிஸ்டும் திறக்கும். உங்கள் தினசரி பணியுடன் சேர்த்து, உங்கள் வேகத்தில் அதை செய்யுங்கள்.",
  "guide.step5": "சில முக்கியமான மைல்கல்களில், நூருடன் ஒன்றாக வேலை செய்ய இலவச 15-நிமிட அமர்வை பதிவு செய்யும் வாய்ப்பு கிடைக்கும்.",
  "guide.cta": "புரிந்தது, தொடங்கலாம்!",

  "day.note_label": "உங்கள் குறிப்பு (விருப்பத்தேர்வு)",
  "day.note_placeholder": "இன்று பற்றி நினைவில் வைக்க வேண்டியது ஏதேனும்...",

  "phase.discover.name": "உங்கள் திறமையைக் கண்டறியுங்கள்",
  "phase.discover.range": "நாள் 1–3",
  "phase.discover.mission": "உங்கள் இகிகாய் மண்டலத்தில் கண்டறிந்த திறமையைப் பயிற்சி செய்யுங்கள் — உண்மையில், தொடர்ச்சியாக மூன்று நாட்கள். இது தயாராக இருப்பது பற்றியது அல்ல. இது உண்மையில் இது நீங்கள்தானா என்பதைக் கண்டறிவது பற்றியது.",
  "day.1.title": "இன்று 30 நிமிடங்கள் செய்யுங்கள்",
  "day.1.task": "நீங்கள் கண்டறிந்த திறமையை குறைந்தது 30 நிமிடங்கள் உண்மையில் செய்யுங்கள் — அதைப் பற்றி ஆராயவேண்டாம், அதைச் செய்யுங்கள்.",
  "day.2.title": "மீண்டும் செய்யுங்கள், சற்று அதிக நேரம்",
  "day.2.task": "நேற்றைய பயிற்சியை மீண்டும் செய்யுங்கள். எது எளிதாக உணரப்பட்டது, எது சுமையாக உணரப்பட்டது என்பதைக் கவனியுங்கள்.",
  "day.3.title": "முடிவு செய்யுங்கள்: இது உங்களைப் போல் தோன்றுகிறதா?",
  "day.3.task": "இன்னும் ஒருமுறை பயிற்சி செய்யுங்கள், பிறகு நேர்மையாக பதிலளியுங்கள் — அடுத்த 27 நாட்கள் இதைச் செய்யும் உங்களை நீங்கள் காணமுடியுமா?",
  "day3.decision.question": "நேர்மையாக இருங்கள். இது இன்னும் சரியாக உணரப்படுகிறதா?",
  "day3.decision.yes": "ஆம், இது என் திறமை — தொடரவும்",
  "day3.decision.no": "இல்லை, என் திறமையை மீண்டும் வரையறுக்க வேண்டும்",
  "day3.decision.no_note": "உங்கள் இகிகாயை மீண்டும் கண்டறிய குயிக் ஸ்டார்ட் டூலுக்கு அனுப்பப்படுவீர்கள். தயாராக இருக்கும்போது இங்கு திரும்பி வாருங்கள் — நாள் 1–3 மீட்டமைக்கப்படும், அதனால் உங்கள் புதிய பதிலுடன் மீண்டும் முயற்சிக்கலாம்.",
  "redo.banner_title": "மீண்டும் வரவேற்கிறோம்!",
  "redo.banner_body": "உங்கள் திறமையை மீண்டும் வரையறுக்கச் சென்றீர்கள் போல் தெரிகிறது. உங்கள் புதிய திசையுடன் நாள் 1–3ஐ மீண்டும் தொடங்க தயாரா?",
  "redo.banner_cta": "நாள் 1–3ஐ மீண்டும் தொடங்கவும்",
  "redo.banner_dismiss": "இப்போது வேண்டாம்",

  "phase.test1.name": "மார்க்கெட் டெஸ்ட்",
  "phase.test1.range": "நாள் 4–6",
  "phase.test1.mission": "எதையும் உருவாக்குவதற்கு முன், உண்மையில் யாருக்காவது அது வேண்டுமா என்பதைக் கண்டறியுங்கள். ஒரு 5-நிமிட கணக்கெடுப்பு, மாதக்கணக்கான யூகங்களை விட சிறந்தது.",
  "survey.howto_label": "உங்கள் கணக்கெடுப்பை எப்படி உருவாக்குவது",
  "survey.howto_intro": "உங்களுக்கு எது எளிதோ அதைத் தேர்வு செய்யுங்கள் — இரண்டும் நன்றாக வேலை செய்யும்.",
  "survey.forms_title": "விருப்பம் A: கூகுள் ஃபார்ம்ஸ் (பரிந்துரைக்கப்படுகிறது)",
  "survey.forms_step1": "forms.google.com க்குச் சென்று, ஒரு காலி படிவத்தைத் தொடங்க + ஐ கிளிக் செய்யுங்கள்.",
  "survey.forms_step2": "3–5 சிறு கேள்விகளைச் சேர்க்கவும், உதாரணமாக \"இதை நீங்கள் பயன்படுத்துவீர்களா/வாங்குவீர்களா?\", \"இதற்கு எவ்வளவு செலுத்த எதிர்பார்க்கிறீர்கள்?\", \"உங்கள் மிகப்பெரிய தயக்கம் என்ன?\"",
  "survey.forms_step3": "Send ஐ கிளிக் செய்யுங்கள், பிறகு ஒரு சிறு பகிரக்கூடிய இணைப்பை நகலெடுக்க இணைப்பு ஐகானை கிளிக் செய்யுங்கள்.",
  "survey.forms_step4": "பதில்கள் தானாகவே இணைக்கப்பட்ட கூகுள் ஷீட்டில் சேகரிக்கப்படும் — எப்போது வேண்டுமானாலும் பார்க்க Responses தாவலைக் கிளிக் செய்யுங்கள்.",
  "survey.paper_title": "விருப்பம் B: காகித கணக்கெடுப்பு",
  "survey.paper_step1": "உங்கள் அதே 3–5 கேள்விகளை ஒரு தாளின் மேலே எழுதுங்கள், கீழே பதிலளிக்க இடம் விட்டு.",
  "survey.paper_step2": "சில நகல்களை ஃபோட்டோகாபி செய்யவும் அல்லது கையால் எழுதவும், நேரடியாக மக்களிடம் கொடுங்கள்.",
  "survey.paper_step3": "ஒரு நாள் அல்லது இரண்டு நாட்களுக்குள் அவற்றைத் திரும்பப் பெற்று, பதில்களை ஒரு நோட்புக் அல்லது ஸ்பிரெட்ஷீட்டில் மாற்றுங்கள்.",
  "day.4.title": "உங்கள் எளிய கணக்கெடுப்பை உருவாக்குங்கள்",
  "day.4.task": "நீங்கள் உருவாக்குவதை மக்கள் விரும்புவார்களா அல்லது அதற்கு பணம் செலுத்துவார்களா என்று கேட்கும் 3–5 கேள்வி கணக்கெடுப்பை உருவாக்குங்கள் (கூகுள் ஃபார்ம்ஸ் அல்லது காகிதம்).",
  "day.5.title": "குறைந்தது 15 பேருக்கு அனுப்புங்கள்",
  "day.5.task": "உங்கள் கணக்கெடுப்பு இணைப்பை — அல்லது காகித நகல்களை — நண்பர்கள், குடும்பம், சக ஊழியர்கள், வகுப்பு தோழர்களிடம் பகிருங்கள். குறைந்தது 15 பேரை இலக்காகக் கொள்ளுங்கள்.",
  "day.6.title": "ஒவ்வொரு பதிலையும் படியுங்கள்",
  "day.6.task": "பதில்களை சேகரித்து, நீங்கள் கற்றுக்கொண்ட 3 விஷயங்களை எழுதுங்கள், அவை சங்கடமாக இருந்தாலும் சரி.",

  "phase.build1.name": "அமைப்பை உருவாக்குங்கள்",
  "phase.build1.range": "நாள் 7–9",
  "phase.build1.mission": "நீங்கள் வழங்குவதன் மிகச் சிறிய உண்மையான பதிப்பை உருவாக்க வேண்டிய நேரம் இது — சரியான பதிப்பு அல்ல, நிரூபிக்கக்கூடிய பதிப்பு. இது ஒரு உணவு வகை, ஒரு வகுப்பு, ஒரு சிறிய தொகுதி, அல்லது ஒரு அமர்வாக இருக்கலாம் — இந்த வாரம் நீங்கள் உண்மையில் வழங்கக்கூடிய எதுவும்.",
  "day.7.title": "உங்கள் மிகச் சிறிய டெஸ்ட் பதிப்பை முடிவு செய்யுங்கள்",
  "day.7.task": "இந்த வாரம் நீங்கள் நிஜமாக வழங்கக்கூடிய உங்கள் தயாரிப்பு அல்லது சேவையின் ஒரு எளிய பதிப்பைத் தேர்வு செய்யுங்கள்.",
  "day.8.title": "உங்கள் கணக்கெடுப்பு தரவைப் பயன்படுத்தி விலை நிர்ணயிக்கவும்",
  "day.8.task": "உங்கள் கணக்கெடுப்பில் மக்கள் சொன்னதன் அடிப்படையில் ஒரு விலையை நிர்ணயிக்கவும் — யூகம் அல்ல, போட்டித்தன்மையானது.",
  "day.9.title": "குறைந்தது 3 பேருக்கு வழங்குங்கள்",
  "day.9.task": "உங்கள் டெஸ்ட் பதிப்பை உண்மையில் 3 நிஜமான மக்களுக்கு வழங்குங்கள் — விற்கவும், பரிசாக அளிக்கவும், அல்லது இலவசமாக இயக்கவும்.",

  "phase.feedback1.name": "கருத்துகளை சேகரிக்கவும்",
  "phase.feedback1.range": "நாள் 10–12",
  "phase.feedback1.mission": "இப்போது அதை அனுபவித்த மக்களிடம் திரும்பிச் சென்று, அவர்கள் உண்மையில் என்ன நினைத்தார்கள் என்று கேளுங்கள் — நீங்கள் கேட்க விரும்புவதாக அவர்கள் நினைப்பதை அல்ல.",
  "day.10.title": "உங்கள் முதல் வாடிக்கையாளர்களிடம் கேளுங்கள்",
  "day.10.task": "உங்கள் டெஸ்ட் பதிப்பை அனுபவித்த அனைவரிடமும் கேளுங்கள்: அவர்களுக்கு என்ன பிடித்தது, என்ன மாற்றுவார்கள், மீண்டும் பணம் செலுத்துவார்களா?",
  "day.11.title": "இன்னும் சிலரிடம் கேளுங்கள்",
  "day.11.task": "அதே வழியில் இன்னும் 3 பேரை அடையுங்கள் — உங்கள் கருத்து குழுவை குறைந்தது 6 பேராக வளர்க்கவும்.",
  "day.12.title": "வடிவங்களை எழுதுங்கள்",
  "day.12.task": "மீண்டும் மீண்டும் வரும் கருத்துகளைத் தேடுங்கள் — 2 அல்லது அதற்கு மேற்பட்டவர்களிடமிருந்து ஒரே கருத்து ஒரு உண்மையான சமிக்ஞை, கருத்து அல்ல.",

  "phase.adjust1.name": "பொருத்தத்திற்கு சரிசெய்யுங்கள்",
  "phase.adjust1.range": "நாள் 13–15",
  "phase.adjust1.mission": "இங்குதான் பெரும்பாலான மக்கள் விட்டுவிடுகிறார்கள். நீங்கள் விட்டுவிட வேண்டாம். அதற்குப் பதிலாக சரிசெய்யுங்கள் — முன்கூட்டியே சோதிப்பதன் முழு நோக்கமும் இதுதான்.",
  "day.13.title": "மாற்ற ஒரு விஷயத்தைத் தேர்வு செய்யுங்கள்",
  "day.13.task": "உங்கள் கருத்து வடிவங்களின் அடிப்படையில், செய்ய வேண்டிய மிகப்பெரிய மாற்றத்தைத் தேர்வு செய்யுங்கள் — விலை, வடிவம், சலுகை, அல்லது பார்வையாளர்கள்.",
  "day.14.title": "மாற்றத்தைச் செய்யுங்கள்",
  "day.14.task": "நேற்று நீங்கள் முடிவு செய்ததன் அடிப்படையில் உங்கள் சலுகை, விலை, அல்லது வழங்குதலை உண்மையில் புதுப்பிக்கவும்.",
  "day.15.title": "மைல்கல்: சுற்று 1 முடிந்தது",
  "day.15.task": "நாள் 1ஐ திரும்பிப் பாருங்கள். 15 நாட்களுக்கு முன் தெரியாத எதை இப்போது நீங்கள் அறிவீர்கள் என்பதை ஒரு வாக்கியத்தில் எழுதுங்கள்.",
  "milestone.day15.title": "நீங்கள் இப்போது சுற்று 1ஐ முடித்துவிட்டீர்கள்.",
  "milestone.day15.body": "பதினைந்து நாட்களுக்கு முன் உங்களிடம் ஒரு யோசனை இருந்தது. இப்போது உங்களிடம் உண்மையான கருத்தும் கூர்மையான சலுகையும் உள்ளது — இது பெரும்பாலான மக்கள் அடையும் இடத்தை விட மேலானது. சுற்று 2க்கு முன் இதைப் பற்றி இன்னொரு பார்வை வேண்டுமா?",
  "milestone.cta": "நூருடன் இலவச 15-நிமிட அமர்வை பதிவு செய்யுங்கள்",
  "milestone.dismiss": "சுற்று 2க்குத் தொடரவும்",

  "phase.test2.name": "மீண்டும் சோதிக்கவும், சுற்று 2",
  "phase.test2.range": "நாள் 16–18",
  "phase.test2.mission": "அதே சோதனை, கூர்மையான சலுகை. இந்த முறை மக்களுக்கு என்ன வேண்டும் என்று உங்களுக்கு ஏற்கனவே தெரியும் — நாள் 16 முதல், உங்கள் சோஷியல் மீடியா செக்லிஸ்டும் கீழே திறக்கும். உங்கள் தினசரி பணியுடன் சேர்த்து, உங்கள் வேகத்தில் அதை செய்யுங்கள்.",
  "day.16.title": "உங்கள் கணக்கெடுப்பை மீண்டும் இயக்குங்கள் (சிறு பதிப்பு)",
  "day.16.task": "உங்கள் புதிய சலுகை பற்றி 10 பேருக்கு விரைவான 2-கேள்வி சரிபார்ப்பை அனுப்புங்கள்: இது உங்களுக்கு சிறப்பாக வேலை செய்யுமா?",
  "day.17.title": "உங்கள் விலை மற்றும் சலுகையை உறுதிப்படுத்துங்கள்",
  "day.17.task": "விரைவான சரிபார்ப்பின் அடிப்படையில் உங்கள் சரிசெய்யப்பட்ட விலை மற்றும் சலுகையை பூட்டுங்கள்.",
  "day.18.title": "உங்கள் அடுத்த வழங்குதலை தயார் செய்யுங்கள்",
  "day.18.task": "இந்த வாரம் உங்கள் மேம்பட்ட பதிப்பை வழங்க எல்லாவற்றையும் தயார் செய்யுங்கள்.",

  "phase.build2.name": "மீண்டும் உருவாக்குங்கள், சுற்று 2",
  "phase.build2.range": "நாள் 19–21",
  "phase.build2.mission": "மேம்படுத்தப்பட்ட பதிப்பை வழங்கி, இந்த முறை என்ன வித்தியாசம் என்பதை உன்னிப்பாக கவனியுங்கள்.",
  "day.19.title": "மேம்படுத்தப்பட்ட பதிப்பை வழங்குங்கள்",
  "day.19.task": "உங்கள் சரிசெய்யப்பட்ட சலுகையை குறைந்தது 3 புதிய பேருக்கு வழங்குங்கள்.",
  "day.20.title": "இன்னும் 3 பேருக்கு வழங்குங்கள்",
  "day.20.task": "அதே மேம்படுத்தப்பட்ட சலுகையுடன் இன்னும் 3 பேரை அடையுங்கள் — இந்த சுற்றில் மொத்தம் 6 அல்லது அதற்கு மேற்பட்டோர்.",
  "day.21.title": "என்ன வித்தியாசம் என்பதைக் கண்காணிக்கவும்",
  "day.21.task": "இந்த சுற்றின் எதிர்வினைகளை சுற்று 1உடன் ஒப்பிடுங்கள் — எது சிறப்பாக உள்ளது, இன்னும் என்ன வேலை தேவை?",

  "phase.feedback2.name": "கருத்து + சரிசெய்தல், சுற்று 2",
  "phase.feedback2.range": "நாள் 22–24",
  "phase.feedback2.mission": "நீங்கள் உண்மையில் விற்பதை பூட்டுவதற்கு முன் இன்னும் ஒரு நேர்மையான பார்வை.",
  "day.22.title": "சுற்று 2 கருத்துகளை சேகரிக்கவும்",
  "day.22.task": "உங்கள் சுற்று 2 வாடிக்கையாளர்களிடம் முன்பு போலவே அதே கேள்விகளைக் கேளுங்கள்.",
  "day.23.title": "புதிய வடிவங்களைக் கண்டறியுங்கள்",
  "day.23.task": "சுற்று 1 மற்றும் சுற்று 2 கருத்துகளை அருகருகே ஒப்பிடுங்கள் — என்ன மாறியது?",
  "day.24.title": "மைல்கல்: உங்கள் சலுகையை பூட்டுங்கள்",
  "day.24.task": "முடிவு செய்யுங்கள்: இதுவே இப்போது உங்கள் உண்மையான சலுகை, விலை, மற்றும் பார்வையாளர்கள். இதை ஒரு வரியில் எழுதுங்கள்.",
  "milestone.day24.title": "உங்கள் சலுகை பூட்டப்பட்டது.",
  "milestone.day24.body": "இரண்டு சுற்று உண்மையான சோதனைக்குப் பிறகு, நீங்கள் இனி யூகிக்கவில்லை — நீங்கள் என்ன விற்கிறீர்கள், யாருக்கு, எவ்வளவுக்கு என்பது உங்களுக்குத் தெரியும். இப்போது அவர்களைக் கண்டறியும் நேரம். உங்கள் அவுட்ரீச்சைத் திட்டமிட உதவி வேண்டுமா?",

  "social.title_label": "இணையான பாதை — திறக்கப்பட்டது",
  "social.title": "உங்கள் சோஷியல் இருப்பை உருவாக்குங்கள்",
  "social.subtitle": "இது நாள் 16–24உடன் இணையாக இயங்குகிறது. உங்கள் வேகத்தில் இதைச் செய்யுங்கள் — இது உங்கள் தினசரி பணியைத் தடுக்காது.",
  "social.instagram.title": "இன்ஸ்டாகிராம்",
  "social.instagram.step1": "ஒரு இலவச பிசினஸ் கணக்கை உருவாக்குங்கள் (Settings → Switch to Professional Account).",
  "social.instagram.step2": "உங்கள் பயோவை ஒரு வரியில் எழுதுங்கள்: நீங்கள் யாருக்கு உதவுகிறீர்கள் + நீங்கள் என்ன வழங்குகிறீர்கள்.",
  "social.instagram.step3": "உங்கள் சலுகையையும் அதன் பின்னணி கதையையும் அறிமுகப்படுத்தும் உங்கள் முதல் 3 பதிவுகளை இடுங்கள்.",
  "social.instagram.step4": "உங்கள் துறையில் 20 பேரை அல்லது பக்கங்களை பின்தொடர்ந்து உண்மையாக ஈடுபடுங்கள்.",
  "social.facebook.title": "பேஸ்புக்",
  "social.facebook.step1": "உங்கள் பிசினஸுக்கு ஒரு பேஸ்புக் பக்கத்தை உருவாக்குங்கள் (தனிப்பட்ட சுயவிவரம் அல்ல) — Pages → Create New Page.",
  "social.facebook.step2": "உங்கள் சலுகை, இருப்பிடம், மற்றும் தொடர்பு கொள்ளும் வழியைச் சேர்க்கவும்.",
  "social.facebook.step3": "உங்கள் வாடிக்கையாளர்கள் இருக்கும் 2 உள்ளூர் அல்லது சமூக குழுக்களில் உங்கள் பக்கத்தைப் பகிருங்கள்.",
  "social.youtube.title": "யூட்யூப்",
  "social.youtube.step1": "உங்கள் பிசினஸ் பெயரைப் பயன்படுத்தி ஒரு சேனலை உருவாக்குங்கள்.",
  "social.youtube.step2": "நீங்கள் என்ன செய்கிறீர்கள் மற்றும் அது யாருக்கானது என்பதை விளக்கும் ஒரு குறுகிய வீடியோவை (உங்கள் ஃபோனில் கூட) இடுங்கள்.",
  "social.youtube.step3": "வீடியோ விளக்கத்தில் உங்கள் இன்ஸ்டாகிராம் அல்லது வாட்ஸ்அப் இணைப்பைச் சேர்க்கவும்.",

  "phase.outreach.name": "இலக்கு வாடிக்கையாளர்களை அவுட்ரீச் செய்யுங்கள்",
  "phase.outreach.range": "நாள் 25–30",
  "phase.outreach.mission": "மக்கள் உங்களைக் கண்டுபிடிப்பதற்காக காத்திருப்பதை நிறுத்துங்கள். அவர்களைக் கண்டறியுங்கள் — ஒவ்வொரு உண்மையான பிசினஸும் அதன் முதல் பணம் செலுத்தும் வாடிக்கையாளர்களை இப்படித்தான் பெறுகிறது.",
  "day.25.title": "20 சிறந்த வாடிக்கையாளர்களை பட்டியலிடுங்கள்",
  "day.25.task": "நீங்கள் யாருக்கு விற்க விரும்புகிறீர்களோ அவர்களைப் போன்ற 20 நிஜமான மக்கள் அல்லது பிசினஸ்களை எழுதுங்கள்.",
  "day.26.title": "உங்கள் அவுட்ரீச் செய்தியை எழுதுங்கள்",
  "day.26.task": "அவர்களில் யாருக்கும் அனுப்பக்கூடிய ஒரு குறுகிய, நேர்மையான செய்தியை எழுதுங்கள் — கடினமான விற்பனை இல்லை, ஒரு உண்மையான சலுகை மட்டும்.",
  "day.27.title": "உங்கள் முதல் 5 பேருக்கு அனுப்புங்கள்",
  "day.27.task": "இன்று உங்கள் பட்டியலின் முதல் 5 பேருக்கு செய்தி அனுப்புங்கள்.",
  "day.28.title": "பின்தொடர்ந்து மேம்படுத்துங்கள்",
  "day.28.task": "பதிலளிக்காதவர்களுடன் பின்தொடருங்கள், மேலும் உங்கள் செய்தி பலனளிக்கவில்லை என்றால் அதை சரிசெய்யுங்கள்.",
  "day.29.title": "அடுத்த 10 பேருக்கு அனுப்புங்கள்",
  "day.29.task": "உங்கள் பட்டியலில் மீதமுள்ளவர்களுக்கு செய்தி அனுப்புங்கள்.",
  "day.30.title": "உங்கள் 30 நாட்களை மதிப்பாய்வு செய்யுங்கள்",
  "day.30.task": "இந்த மாதத்தின் உங்கள் 3 மிகப்பெரிய வெற்றிகளை எழுதுங்கள் — நீங்கள் உண்மையான ஒன்றை உருவாக்கியுள்ளீர்கள்.",

  "final.eyebrow": "30 நாட்கள் முடிந்தது",
  "final.title": "நீங்கள் ஒரு பாடத்தை மட்டும் முடிக்கவில்லை. நீங்கள் ஒரு பிசினஸை உருவாக்கினீர்கள்.",
  "final.body": "முப்பது நாட்களுக்கு முன் இது ஒரு யோசனையாக இருந்தது. இப்போது இது ஒரு சோதிக்கப்பட்ட சலுகை, நிஜமான வாடிக்கையாளர்கள், நிஜமான கருத்து, மற்றும் நீங்களே உருவாக்கிய ஒரு சோஷியல் இருப்பு. அடுத்த கட்டம் — சரியாக விலை நிர்ணயித்தல், அதை பெரிதாக்குதல், மற்றும் அதை நிலையான வருமானமாக மாற்றுதல் — இதற்குத்தான் நூருடனான 1:1 பயிற்சி.",
  "final.founder_role": "நிறுவனர், thedayzero by TheKahaaniya",
  "final.cta": "என் இலவச 15-நிமிட அமர்வை பதிவு செய்யுங்கள்",
  "final.note": "பதிவு செய்ய ஒரு நிமிடத்திற்கும் குறைவான நேரம் ஆகும். உங்களுக்கு ஏற்ற எந்த நேரத்தையும் தேர்வு செய்யுங்கள்.",

  "footer.contact": "வாட்ஸ்அப் +91 96298 43122 · @the.kahaaniya",
  "footer.quickstart_link": "இகிகாய் குயிக் ஸ்டார்ட் டூலை மீண்டும் செய்யுங்கள்"
}
};
</script>
<script>
(function(){
  "use strict";

  function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  var prefersReducedMotion = false;
  try{ prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(prefersReducedMotion){ document.documentElement.classList.add('reduce-motion'); }

  /* ================= Data model ================= */
  var PHASES = [
    { key:'discover',  days:[1,2,3],             howto:null,     milestoneAfter:null },
    { key:'test1',     days:[4,5,6],             howto:'survey', milestoneAfter:null },
    { key:'build1',    days:[7,8,9],             howto:null,     milestoneAfter:null },
    { key:'feedback1', days:[10,11,12],          howto:null,     milestoneAfter:null },
    { key:'adjust1',   days:[13,14,15],          howto:null,     milestoneAfter:'day15' },
    { key:'test2',     days:[16,17,18],          howto:null,     milestoneAfter:null, socialAfter:true },
    { key:'build2',    days:[19,20,21],          howto:null,     milestoneAfter:null },
    { key:'feedback2', days:[22,23,24],          howto:null,     milestoneAfter:'day24' },
    { key:'outreach',  days:[25,26,27,28,29,30], howto:null,     milestoneAfter:null }
  ];
  var TOTAL_DAYS = 30;

  var STATE_KEY = 'dzc_state_v1';
  var LANG_KEY = 'dz_lang';
  var REDO_FLAG_KEY = 'dz_redo_discovery_requested';
  var GUIDE_SHOWN_KEY = 'dzc_guide_shown';
  var MILESTONE_DISMISS_PREFIX = 'dzc_milestone_dismissed_';
  var IDENTITY_KEY = 'dzc_identity_v1';
  var IDENTITY_PROMPTED_KEY = 'dzc_identity_prompted';

  // Google Apps Script Web App URL — appendRow order must be [timestamp, name, phone, email, source, page]
  // to match the already-deployed script. We repurpose: email -> day/phase label, source -> event type, page -> proof text.
  var PROGRESS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfX4R5jNmQ3l1vC-FVx9Ud5Xl1CEHs4sae06nTjjizS61eIzwAcYCp2rbzvswGqixu/exec";

  var state = {
    days: {},            // {1: {complete:true, note:'...', proof:'...'}, ...}
    social: {},           // {instagram_step1:true, ...}
    socialHandles: {},    // {instagram:'', facebook:'', youtube:''}
    expandedDay: null
  };
  for(var i=1;i<=TOTAL_DAYS;i++){ state.days[i] = {complete:false, note:'', proof:''}; }

  function loadState(){
    var raw = safeGet(STATE_KEY);
    if(!raw) return;
    try{
      var saved = JSON.parse(raw);
      if(saved.days){
        Object.keys(saved.days).forEach(function(k){
          if(state.days[k]) state.days[k] = Object.assign(state.days[k], saved.days[k]);
        });
      }
      if(saved.social) state.social = saved.social;
      if(saved.socialHandles) state.socialHandles = saved.socialHandles;
    }catch(e){}
  }
  function saveState(){ safeSet(STATE_KEY, JSON.stringify({days:state.days, social:state.social, socialHandles:state.socialHandles})); }

  /* ================= Identity (name + phone, so proof rows are attributable) ================= */
  function getIdentity(){
    var raw = safeGet(IDENTITY_KEY);
    if(!raw) return {name:'', phone:''};
    try{ var v = JSON.parse(raw); return {name:v.name||'', phone:v.phone||''}; }catch(e){ return {name:'', phone:''}; }
  }
  function setIdentity(name, phone){
    safeSet(IDENTITY_KEY, JSON.stringify({name:name||'', phone:phone||''}));
  }
  function hasIdentity(){ var id = getIdentity(); return !!(id.name && id.name.trim()); }

  /* ================= Progress → Google Sheet ================= */
  function submitProgressRow(eventType, dayLabel, proofText){
    if(!PROGRESS_SCRIPT_URL || PROGRESS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) return;
    var id = getIdentity();
    var payload = {
      name: id.name || '(not provided)',
      phone: id.phone || '',
      email: dayLabel + ' [' + currentLang + ']',
      source: eventType,
      page: proofText || '(no proof added)'
    };
    try{
      fetch(PROGRESS_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) });
    }catch(e){}
  }

  function isComplete(n){ return !!(state.days[n] && state.days[n].complete); }
  function isUnlocked(n){ if(n === 1) return true; return isComplete(n-1); }
  function completedCount(){
    var c = 0;
    for(var i=1;i<=TOTAL_DAYS;i++){ if(isComplete(i)) c++; }
    return c;
  }
  function firstIncompleteDay(){
    for(var i=1;i<=TOTAL_DAYS;i++){ if(!isComplete(i)) return i; }
    return TOTAL_DAYS;
  }

  /* ================= i18n ================= */
  var currentLang = safeGet(LANG_KEY) || 'en';
  function dict(){ return window.I18N[currentLang] || window.I18N.en; }
  function t(key){
    var d = dict();
    var val = d[key];
    if(val === undefined) val = window.I18N.en[key] !== undefined ? window.I18N.en[key] : key;
    return val;
  }
  function tf(key, params){
    var s = t(key);
    Object.keys(params||{}).forEach(function(p){ s = s.replace('{'+p+'}', params[p]); });
    return s;
  }

  function applyStaticI18n(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(key) el.textContent = t(key);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      var key = el.getAttribute('data-i18n-placeholder');
      if(key) el.setAttribute('placeholder', t(key));
    });
    document.documentElement.setAttribute('lang', currentLang);
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
    });
  }

  function setLang(lang){
    currentLang = lang;
    safeSet(LANG_KEY, lang);
    applyStaticI18n();
    renderCourse();
    updateIdentityBadge();
    if(window.gtag) gtag('event','language_change',{'event_category':'engagement','event_label':lang});
  }
  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ setLang(btn.getAttribute('data-lang')); });
  });

  /* ================= Rendering ================= */
  var courseBody = document.getElementById('courseBody');

  function phaseNumIndex(phaseKey){
    return PHASES.findIndex(function(p){ return p.key === phaseKey; }) + 1;
  }

  function dayCardHtml(n){
    var complete = isComplete(n);
    var unlocked = isUnlocked(n);
    var isToday = unlocked && !complete;
    var classes = ['day-card'];
    if(!unlocked) classes.push('locked');
    if(complete) classes.push('completed');
    if(isToday) classes.push('today');
    var note = (state.days[n] && state.days[n].note) || '';

    var tag = complete ? t('day.completed_tag') : (unlocked ? t('day.today_tag') : tf('day.locked_tag', {n:n-1}));

    var bodyInner = '';
    if(n === 3){
      var noteVisible = false;
      bodyInner += '<p class="day-task">' + escapeHtml(t('day.'+n+'.task')) + '</p>';
      bodyInner += '<div class="decision-box">' +
        '<div class="decision-q">' + escapeHtml(t('day3.decision.question')) + '</div>' +
        '<div class="decision-actions">' +
          '<button class="btn btn-primary btn-sm clickable" data-decision="yes" type="button">' + escapeHtml(t('day3.decision.yes')) + '</button>' +
          '<button class="btn btn-ghost btn-sm clickable" data-decision="no" type="button">' + escapeHtml(t('day3.decision.no')) + '</button>' +
        '</div>' +
        '<div class="decision-no-note" id="decisionNoNote">' + escapeHtml(t('day3.decision.no_note')) + '</div>' +
      '</div>';
    } else {
      var proof = (state.days[n] && state.days[n].proof) || '';
      bodyInner += '<p class="day-task">' + escapeHtml(t('day.'+n+'.task')) + '</p>';
      bodyInner += '<div class="day-note">' +
        '<label>' + escapeHtml(t('day.note_label')) + '</label>' +
        '<textarea data-note-day="' + n + '" placeholder="' + escapeHtml(t('day.note_placeholder')) + '">' + escapeHtml(note) + '</textarea>' +
      '</div>';
      bodyInner += '<div class="day-proof">' +
        '<label>' + escapeHtml(t('day.proof_label')) + '</label>' +
        '<input type="text" data-proof-day="' + n + '" placeholder="' + escapeHtml(t('day.proof_placeholder')) + '" value="' + escapeHtml(proof) + '">' +
        '<p class="proof-hint">' + escapeHtml(t('day.proof_hint')) + '</p>' +
      '</div>';
      bodyInner += '<div class="day-footer">' +
        '<div class="day-complete-check clickable" data-toggle-day="' + n + '">' +
          '<div class="day-checkbox' + (complete ? ' checked' : '') + '"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
          '<span class="day-complete-label">' + escapeHtml(tf('day.complete_btn', {n:n})) + '</span>' +
        '</div>' +
        '<span class="proof-sent-indicator" data-proof-sent="' + n + '">' + (complete ? escapeHtml(t('day.proof_saved')) : '') + '</span>' +
      '</div>';
    }

    return (
      '<div class="' + classes.join(' ') + '" data-day-card="' + n + '">' +
        '<div class="day-head" data-day-toggle="' + n + '">' +
          '<div class="day-num">' + n + '</div>' +
          '<div class="day-titlewrap">' +
            '<div class="day-title">' + escapeHtml(t('day.'+n+'.title')) + '</div>' +
            '<div class="day-tag">' + escapeHtml(tag) + '</div>' +
          '</div>' +
          '<svg class="day-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
        '</div>' +
        '<div class="day-body">' + bodyInner + '</div>' +
      '</div>'
    );
  }

  function howtoSurveyHtml(){
    return (
      '<div class="howto-card" id="surveyHowto">' +
        '<div class="howto-toggle" data-howto-toggle="surveyHowto">' +
          '<div class="label">' + escapeHtml(t('survey.howto_label')) + '</div>' +
          '<svg class="day-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
        '</div>' +
        '<div class="howto-body">' +
          '<p style="font-size:13px;color:var(--ink-soft);">' + escapeHtml(t('survey.howto_intro')) + '</p>' +
          '<div class="howto-sub">' + escapeHtml(t('survey.forms_title')) + '</div>' +
          '<ul class="howto-steps">' +
            '<li><b>1.</b><span>' + escapeHtml(t('survey.forms_step1')) + '</span></li>' +
            '<li><b>2.</b><span>' + escapeHtml(t('survey.forms_step2')) + '</span></li>' +
            '<li><b>3.</b><span>' + escapeHtml(t('survey.forms_step3')) + '</span></li>' +
            '<li><b>4.</b><span>' + escapeHtml(t('survey.forms_step4')) + '</span></li>' +
          '</ul>' +
          '<div class="howto-sub">' + escapeHtml(t('survey.paper_title')) + '</div>' +
          '<ul class="howto-steps">' +
            '<li><b>1.</b><span>' + escapeHtml(t('survey.paper_step1')) + '</span></li>' +
            '<li><b>2.</b><span>' + escapeHtml(t('survey.paper_step2')) + '</span></li>' +
            '<li><b>3.</b><span>' + escapeHtml(t('survey.paper_step3')) + '</span></li>' +
          '</ul>' +
        '</div>' +
      '</div>'
    );
  }

  var SOCIAL_STEPS = {
    instagram: ['step1','step2','step3','step4'],
    facebook: ['step1','step2','step3'],
    youtube: ['step1','step2','step3']
  };

  function socialBlockHtml(){
    var unlocked = isUnlocked(16);
    if(!unlocked) return '';
    var platforms = ['instagram','facebook','youtube'];
    var cards = platforms.map(function(p){
      var steps = SOCIAL_STEPS[p].map(function(stepKey, idx){
        var id = p + '_' + stepKey;
        var checked = !!state.social[id];
        return '<div class="social-step">' +
          '<div class="sc' + (checked ? ' checked' : '') + '" data-social-toggle="' + id + '"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
          '<span class="txt' + (checked ? ' done' : '') + '" data-social-toggle="' + id + '">' + escapeHtml(t('social.'+p+'.'+stepKey)) + '</span>' +
        '</div>';
      }).join('');
      var handleVal = (state.socialHandles && state.socialHandles[p]) || '';
      var handleBlock = '<div class="social-handle">' +
        '<label>' + escapeHtml(t('social.'+p+'.handle_label')) + '</label>' +
        '<div class="social-handle-row">' +
          '<input type="text" data-social-handle="' + p + '" placeholder="' + escapeHtml(t('social.handle_placeholder')) + '" value="' + escapeHtml(handleVal) + '">' +
          '<button class="btn btn-primary btn-sm clickable" data-social-handle-save="' + p + '" type="button">' + escapeHtml(t('social.handle_save')) + '</button>' +
        '</div>' +
        '<span class="proof-sent-indicator" data-social-handle-sent="' + p + '"></span>' +
      '</div>';
      return '<div class="social-card"><h3>' + escapeHtml(t('social.'+p+'.title')) + '</h3>' + steps + handleBlock + '</div>';
    }).join('');

    return (
      '<div class="social-block" id="socialBlock">' +
        '<div class="label">' + escapeHtml(t('social.title_label')) + '</div>' +
        '<h2>' + escapeHtml(t('social.title')) + '</h2>' +
        '<p class="subtitle">' + escapeHtml(t('social.subtitle')) + '</p>' +
        '<div class="social-platforms">' + cards + '</div>' +
      '</div>'
    );
  }

  function milestoneHtml(key){
    var dismissedKey = MILESTONE_DISMISS_PREFIX + key;
    var dayTrigger = key === 'day15' ? 15 : 24;
    var visible = isComplete(dayTrigger) && !safeGet(dismissedKey);
    return (
      '<div class="milestone-card' + (visible ? ' show' : '') + '" id="milestone_' + key + '" data-milestone="' + key + '">' +
        '<div class="label" style="color:var(--sage-bright);">' + escapeHtml(t('milestone.cta')).split(' ')[0] + '</div>' +
        '<h3>' + escapeHtml(t('milestone.'+key+'.title')) + '</h3>' +
        '<p>' + escapeHtml(t('milestone.'+key+'.body')) + '</p>' +
        '<div class="milestone-actions">' +
          '<button class="btn btn-primary clickable" type="button" data-milestone-book="' + key + '">' + escapeHtml(t('milestone.cta')) + '</button>' +
          '<button class="btn btn-ghost clickable" data-milestone-dismiss="' + key + '" type="button">' + escapeHtml(t('milestone.dismiss')) + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCourse(){
    var html = '';
    PHASES.forEach(function(phase, idx){
      html += '<div class="phase-block" data-phase="' + phase.key + '">';
      html += '<div class="phase-head"><div class="phase-num">' + t('phase.'+phase.key+'.range') + '</div><h2>' + escapeHtml(t('phase.'+phase.key+'.name')) + '</h2></div>';
      html += '<p class="phase-mission">' + escapeHtml(t('phase.'+phase.key+'.mission')) + '</p>';
      if(phase.howto === 'survey') html += howtoSurveyHtml();
      phase.days.forEach(function(n){ html += dayCardHtml(n); });
      if(phase.milestoneAfter) html += milestoneHtml(phase.milestoneAfter);
      if(phase.socialAfter) html += socialBlockHtml();
      html += '</div>';
    });
    courseBody.innerHTML = html;
    bindCourseEvents();
    updateProgressUI();
    updateFinalBlock();
  }

  /* ================= Events (delegated after each render) ================= */
  function bindCourseEvents(){
    courseBody.querySelectorAll('[data-day-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var n = parseInt(el.getAttribute('data-day-toggle'), 10);
        if(!isUnlocked(n)) return;
        var card = courseBody.querySelector('[data-day-card="'+n+'"]');
        card.classList.toggle('expanded');
      });
    });
    courseBody.querySelectorAll('[data-note-day]').forEach(function(ta){
      var timer = null;
      ta.addEventListener('input', function(){
        var n = ta.getAttribute('data-note-day');
        state.days[n].note = ta.value;
        clearTimeout(timer);
        timer = setTimeout(saveState, 400);
      });
    });
    courseBody.querySelectorAll('[data-proof-day]').forEach(function(input){
      var timer = null;
      input.addEventListener('input', function(){
        var n = input.getAttribute('data-proof-day');
        state.days[n].proof = input.value;
        clearTimeout(timer);
        timer = setTimeout(saveState, 400);
      });
    });
    courseBody.querySelectorAll('[data-social-handle]').forEach(function(input){
      input.addEventListener('input', function(){
        var p = input.getAttribute('data-social-handle');
        state.socialHandles[p] = input.value;
      });
    });
    courseBody.querySelectorAll('[data-social-handle-save]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var p = btn.getAttribute('data-social-handle-save');
        var input = courseBody.querySelector('[data-social-handle="' + p + '"]');
        var val = input ? input.value.trim() : '';
        state.socialHandles[p] = val;
        saveState();
        promptIdentityIfMissing(function(){
          submitProgressRow('social_' + p + '_handle', 'Social — ' + p, val);
          var indicator = courseBody.querySelector('[data-social-handle-sent="' + p + '"]');
          if(indicator) indicator.textContent = t('social.handle_saved');
          if(window.gtag) gtag('event','social_handle_saved',{'event_category':'engagement','event_label':p});
        });
      });
    });
    courseBody.querySelectorAll('[data-toggle-day]').forEach(function(el){
      el.addEventListener('click', function(){
        var n = parseInt(el.getAttribute('data-toggle-day'), 10);
        completeDay(n);
      });
    });
    courseBody.querySelectorAll('[data-decision]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var decision = btn.getAttribute('data-decision');
        if(decision === 'yes'){
          safeSet(REDO_FLAG_KEY, '');
          completeDay(3);
        } else {
          var note = courseBody.querySelector('#decisionNoNote');
          if(note) note.classList.add('show');
          safeSet(REDO_FLAG_KEY, '1');
          if(window.gtag) gtag('event','redo_skill_requested',{'event_category':'funnel','event_label':'day3'});
          setTimeout(function(){
            window.location.href = 'https://thedayzero.in/quick-start/';
          }, 1400);
        }
      });
    });
    courseBody.querySelectorAll('[data-howto-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        document.getElementById(el.getAttribute('data-howto-toggle')).classList.toggle('open');
      });
    });
    courseBody.querySelectorAll('[data-social-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-social-toggle');
        state.social[id] = !state.social[id];
        saveState();
        renderCourse();
      });
    });
    courseBody.querySelectorAll('[data-milestone-dismiss]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-milestone-dismiss');
        safeSet(MILESTONE_DISMISS_PREFIX + key, '1');
        var card = document.getElementById('milestone_' + key);
        if(card) card.classList.remove('show');
      });
    });
    courseBody.querySelectorAll('[data-milestone-book]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-milestone-book');
        if(window.gtag) gtag('event','milestone_book_click',{'event_category':'conversion','event_label':key});
        openCalendlyModal('milestone_' + key);
      });
    });
  }

  function dayLabelEn(n){
    var phase = PHASES.find(function(p){ return p.days.indexOf(n) !== -1; });
    var phaseName = (window.I18N.en['phase.' + (phase ? phase.key : '') + '.name']) || '';
    var dayTitle = window.I18N.en['day.' + n + '.title'] || '';
    return 'Day ' + n + ' of ' + TOTAL_DAYS + ' — ' + phaseName + ' — ' + dayTitle;
  }

  function completeDay(n){
    var wasComplete = isComplete(n);
    state.days[n].complete = !wasComplete;
    saveState();
    if(!wasComplete){
      if(window.gtag) gtag('event','day_complete',{'event_category':'funnel','event_label':'day_'+n});
      if(n === 15 || n === 24 || n === 30){ fireConfetti(); }
      var proofText = (state.days[n] && state.days[n].proof) || '';
      promptIdentityIfMissing(function(){
        submitProgressRow('day_complete', dayLabelEn(n), proofText);
      });
    }
    renderCourse();
    // scroll to the newly unlocked day for continuity
    if(!wasComplete && n < TOTAL_DAYS){
      setTimeout(function(){
        var nextCard = courseBody.querySelector('[data-day-card="'+(n+1)+'"]');
        if(nextCard) nextCard.scrollIntoView({behavior: prefersReducedMotion ? 'auto' : 'smooth', block:'center'});
      }, 200);
    }
  }

  /* ================= Progress / hero ================= */
  var circumference = 264;
  function updateProgressUI(){
    var done = completedCount();
    document.getElementById('ringFill').setAttribute('stroke-dashoffset', String(circumference - (circumference * done / TOTAL_DAYS)));
    document.getElementById('ringText').textContent = done + '/' + TOTAL_DAYS;
    document.getElementById('heroBarFill').style.width = ((done/TOTAL_DAYS)*100) + '%';
    var sub = document.getElementById('progressSub');
    if(done === 0){ sub.textContent = tf('hero.resume', {n:1}); }
    else if(done < TOTAL_DAYS){ sub.textContent = tf('hero.resume', {n: firstIncompleteDay()}); }
    else { sub.textContent = t('final.eyebrow'); }
  }

  function updateFinalBlock(){
    var block = document.getElementById('finalBlock');
    var shouldShow = isComplete(30);
    block.classList.toggle('show', shouldShow);
    if(shouldShow) loadCalendlyWidget();
  }

  /* ================= Redo banner ================= */
  function updateRedoBanner(){
    var banner = document.getElementById('redoBanner');
    var flag = safeGet(REDO_FLAG_KEY);
    banner.classList.toggle('show', flag === '1');
  }
  document.getElementById('redoRestartBtn').addEventListener('click', function(){
    [1,2,3].forEach(function(n){ state.days[n] = {complete:false, note:''}; });
    saveState();
    safeSet(REDO_FLAG_KEY, '');
    updateRedoBanner();
    renderCourse();
    if(window.gtag) gtag('event','redo_restart_confirmed',{'event_category':'funnel'});
    window.scrollTo({top:0, behavior: prefersReducedMotion ? 'auto' : 'smooth'});
  });
  document.getElementById('redoDismissBtn').addEventListener('click', function(){
    document.getElementById('redoBanner').classList.remove('show');
  });

  /* ================= Confetti ================= */
  function fireConfetti(){
    if(prefersReducedMotion) return;
    var canvas = document.getElementById('confettiCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    var colors = ['#c97a3f','#4f6d61','#7fa396','#141a13','#fffdf7'];
    var pieces = [];
    for(var i=0;i<70;i++){
      pieces.push({
        x: canvas.width/2 + (Math.random()-0.5)*140, y: canvas.height*0.25,
        vx:(Math.random()-0.5)*7, vy:-Math.random()*6-3, size:Math.random()*6+4,
        color:colors[i%colors.length], rot:Math.random()*360, vrot:(Math.random()-0.5)*10
      });
    }
    var start = null;
    function frame(ts){
      if(!start) start = ts;
      var elapsed = ts - start;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(function(p){
        p.vy += 0.16; p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1-elapsed/2200);
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx.restore();
      });
      if(elapsed < 2200){ requestAnimationFrame(frame); } else { ctx.clearRect(0,0,canvas.width,canvas.height); }
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function(){
    var c = document.getElementById('confettiCanvas'); c.width = window.innerWidth; c.height = window.innerHeight;
  });

  /* ================= Calendly ================= */
  var calendlyLoaded = false;
  function loadCalendlyWidget(){
    if(calendlyLoaded) return;
    calendlyLoaded = true;
    var script = document.createElement('script');
    script.src = 'https://assets.calendly.com/assets/external/widget.js';
    script.async = true;
    document.body.appendChild(script);
  }

  // Booking always opens in an in-page modal (never a new tab) so there's always a visible
  // way back to the course — this matters most on mobile/in-app browsers where a new tab
  // can feel like a dead end.
  var calendlyOverlay = document.getElementById('calendlyOverlay');
  function openCalendlyModal(sourceLabel){
    loadCalendlyWidget();
    calendlyOverlay.classList.add('show');
    if(window.gtag) gtag('event','calendly_modal_open',{'event_category':'conversion','event_label':sourceLabel || ''});
  }
  function closeCalendlyModal(){ calendlyOverlay.classList.remove('show'); }
  document.getElementById('calendlyCloseBtn').addEventListener('click', closeCalendlyModal);
  calendlyOverlay.addEventListener('click', function(e){ if(e.target === calendlyOverlay) closeCalendlyModal(); });

  /* ================= Guide modal ================= */
  var guideOverlay = document.getElementById('guideOverlay');
  function openGuide(){ guideOverlay.classList.add('show'); if(window.gtag) gtag('event','guide_open',{'event_category':'engagement'}); }
  function closeGuide(){ guideOverlay.classList.remove('show'); }
  document.getElementById('guideOpenBtn').addEventListener('click', openGuide);
  document.getElementById('guideCloseBtn').addEventListener('click', closeGuide);
  document.getElementById('guideCtaBtn').addEventListener('click', closeGuide);
  guideOverlay.addEventListener('click', function(e){ if(e.target === guideOverlay) closeGuide(); });

  function maybeShowGuide(){
    if(!safeGet(GUIDE_SHOWN_KEY)){
      setTimeout(openGuide, 500);
      safeSet(GUIDE_SHOWN_KEY, '1');
    }
  }

  /* ================= Identity modal (name + phone) ================= */
  var identityOverlay = document.getElementById('identityOverlay');
  var identityFormEl = document.getElementById('identityFormEl');
  var identityNameInput = document.getElementById('identityNameInput');
  var identityPhoneInput = document.getElementById('identityPhoneInput');
  var identityBadge = document.getElementById('identityBadge');
  var pendingIdentityCallback = null;

  function updateIdentityBadge(){
    var id = getIdentity();
    if(id.name && id.name.trim()){
      identityBadge.textContent = id.name.trim();
      identityBadge.classList.add('has-name');
    } else {
      identityBadge.textContent = t('identity.badge_add');
      identityBadge.classList.remove('has-name');
    }
  }

  function openIdentity(){
    var id = getIdentity();
    identityNameInput.value = id.name || '';
    identityPhoneInput.value = id.phone || '';
    identityOverlay.classList.add('show');
  }
  function closeIdentity(){
    identityOverlay.classList.remove('show');
    var cb = pendingIdentityCallback;
    pendingIdentityCallback = null;
    if(cb) cb();
  }
  // Force an identity check before a proof-bearing action, but never hard-block it —
  // if the user has already been asked once (skipped or filled), just proceed.
  function promptIdentityIfMissing(callback){
    if(hasIdentity() || safeGet(IDENTITY_PROMPTED_KEY)){
      callback();
      return;
    }
    pendingIdentityCallback = callback;
    openIdentity();
  }

  identityBadge.addEventListener('click', function(){ pendingIdentityCallback = null; openIdentity(); });
  document.getElementById('identitySkipBtn').addEventListener('click', function(){
    safeSet(IDENTITY_PROMPTED_KEY, '1');
    closeIdentity();
    maybeShowGuide();
  });
  identityOverlay.addEventListener('click', function(e){ if(e.target === identityOverlay){ safeSet(IDENTITY_PROMPTED_KEY, '1'); closeIdentity(); maybeShowGuide(); } });
  identityFormEl.addEventListener('submit', function(e){
    e.preventDefault();
    var name = identityNameInput.value.trim();
    var phone = identityPhoneInput.value.trim();
    setIdentity(name, phone);
    safeSet(IDENTITY_PROMPTED_KEY, '1');
    updateIdentityBadge();
    if(window.gtag) gtag('event','identity_captured',{'event_category':'engagement'});
    closeIdentity();
    maybeShowGuide();
  });

  /* ================= Sticky help CTA ================= */
  var helpStickyBtn = document.getElementById('helpStickyBtn');
  if(helpStickyBtn){
    helpStickyBtn.addEventListener('click', function(){
      if(window.gtag) gtag('event','sticky_help_click',{'event_category':'conversion'});
      openCalendlyModal('sticky');
    });
  }

  /* ================= Init ================= */
  loadState();
  applyStaticI18n();
  updateIdentityBadge();
  updateRedoBanner();
  renderCourse();
  if(!safeGet(IDENTITY_PROMPTED_KEY) && !hasIdentity()){
    setTimeout(openIdentity, 600);
  } else {
    maybeShowGuide();
  }
})();

</script>
</body>
</html>
